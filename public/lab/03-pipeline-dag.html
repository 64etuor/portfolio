<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>park_yangha.dag — Notion OS · Org Operating System</title>
<style>
  :root{
    --bg:#0a0e14;
    --bg2:#0d1117;
    --panel:#10151d;
    --panel2:#161c26;
    --grid:#141b25;
    --line:#1f2733;
    --txt:#c9d4e3;
    --txt-dim:#6b7787;
    --txt-faint:#414c5c;
    --accent:#5ee3a1;     /* success green */
    --running:#f0b429;    /* running amber */
    --idle:#3b4756;       /* idle */
    --blue:#4aa8ff;
    --purple:#b08cff;
    --pink:#ff7eb6;
    --cyan:#36d9d9;
    --red:#ff6363;
    --mono:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,'Cascadia Code',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--mono);
    word-break:keep-all;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* ---------- Top toolbar ---------- */
  #toolbar{
    position:fixed;top:0;left:0;right:0;height:46px;z-index:40;
    display:flex;align-items:center;gap:14px;padding:0 14px;
    background:linear-gradient(180deg,#0e141d,#0b1018);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(255,255,255,.02);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px;letter-spacing:.3px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .brand b{color:#fff}
  .brand .path{color:var(--txt-dim);font-weight:400}
  .tb-sep{width:1px;height:22px;background:var(--line)}
  .tb-meta{font-size:11px;color:var(--txt-dim);display:flex;gap:14px;align-items:center}
  .tb-meta .k{color:var(--txt-faint)}
  .tb-meta .v{color:var(--txt)}
  .banner{
    display:flex;align-items:center;gap:7px;font-size:11px;padding:4px 10px;border-radius:5px;
    background:rgba(94,227,161,.08);border:1px solid rgba(94,227,161,.25);color:var(--accent)
  }
  .banner .ok{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .spacer{flex:1}
  .btn{
    font-family:var(--mono);font-size:12px;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:7px 12px;border-radius:6px;
    display:flex;align-items:center;gap:7px;transition:.14s;user-select:none
  }
  .btn:hover{border-color:#33414f;background:#1b2330}
  .btn.run{border-color:rgba(94,227,161,.4);color:var(--accent);background:rgba(94,227,161,.06)}
  .btn.run:hover{background:rgba(94,227,161,.14);box-shadow:0 0 14px rgba(94,227,161,.2)}
  .btn.run.running{border-color:rgba(240,180,41,.5);color:var(--running);background:rgba(240,180,41,.08)}
  .btn .tri{font-size:10px}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--txt-dim);padding:7px 9px}
  .btn-ghost:hover{background:var(--panel2);color:var(--txt)}

  /* ---------- Canvas ---------- */
  #stage{position:fixed;inset:46px 0 0 0;overflow:hidden;cursor:grab;
    background:
      radial-gradient(1200px 700px at 70% 10%, rgba(74,168,255,.05), transparent 60%),
      radial-gradient(900px 600px at 10% 90%, rgba(176,140,255,.05), transparent 60%),
      var(--bg);
  }
  #stage.grabbing{cursor:grabbing}
  #stage:active{cursor:grabbing}
  #gridbg{position:absolute;inset:0;pointer-events:none;z-index:0}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;z-index:1;will-change:transform}
  #edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:1}
  #nodes{position:absolute;top:0;left:0;z-index:2}

  /* ---------- Node card ---------- */
  .node{
    position:absolute;width:230px;border-radius:9px;overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);
    box-shadow:0 6px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);
    transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .node:hover{border-color:#3a4a5c;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 0 1px rgba(94,227,161,.08)}
  .node.sel{border-color:var(--accent);box-shadow:0 12px 36px rgba(0,0,0,.7),0 0 0 1px var(--accent),0 0 22px rgba(94,227,161,.18)}
  .node .top{display:flex;align-items:center;gap:8px;padding:9px 11px 8px;border-bottom:1px solid var(--line)}
  .node .ico{
    width:26px;height:26px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:13px;background:rgba(255,255,255,.04);border:1px solid var(--line)
  }
  .node .ttl{flex:1;min-width:0}
  .node .ttl .name{font-size:12.5px;font-weight:600;color:#e7eef7;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .ttl .type{font-size:9.5px;color:var(--txt-faint);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
  .node .body{padding:8px 11px 10px}
  .node .sub{font-size:10.5px;color:var(--txt-dim);line-height:1.5}
  .node .foot{display:flex;align-items:center;gap:8px;padding:7px 11px;border-top:1px solid var(--line);
    background:rgba(0,0,0,.18);font-size:9.5px;color:var(--txt-faint)}
  .node .foot .dur{margin-left:auto;color:var(--txt-dim)}
  .node .runid{color:var(--txt-faint);font-family:var(--mono)}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;padding:2px 7px;border-radius:20px;
    letter-spacing:.3px;font-weight:600}
  .pill .d{width:5px;height:5px;border-radius:50%}
  .pill.success{color:var(--accent);background:rgba(94,227,161,.1);border:1px solid rgba(94,227,161,.25)}
  .pill.success .d{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .pill.running{color:var(--running);background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.3)}
  .pill.running .d{background:var(--running);box-shadow:0 0 6px var(--running);animation:blink .8s infinite}
  .pill.queued{color:var(--blue);background:rgba(74,168,255,.1);border:1px solid rgba(74,168,255,.25)}
  .pill.queued .d{background:var(--blue)}
  .pill.idle{color:var(--txt-dim);background:rgba(120,135,150,.08);border:1px solid var(--line)}
  .pill.idle .d{background:var(--idle)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* node status accents (left bar) */
  .node::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--idle);transition:.3s}
  .node[data-status="success"]::before{background:var(--accent);box-shadow:0 0 12px rgba(94,227,161,.5)}
  .node[data-status="running"]::before{background:var(--running);box-shadow:0 0 12px rgba(240,180,41,.6);animation:flow 1s linear infinite}
  .node[data-status="queued"]::before{background:var(--blue)}
  @keyframes flow{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}

  /* group tint by kind */
  .node[data-kind="source"] .ico{color:var(--blue);background:rgba(74,168,255,.1);border-color:rgba(74,168,255,.2)}
  .node[data-kind="decision"] .ico{color:var(--purple);background:rgba(176,140,255,.1);border-color:rgba(176,140,255,.2)}
  .node[data-kind="okr"] .ico{color:var(--cyan);background:rgba(54,217,217,.1);border-color:rgba(54,217,217,.2)}
  .node[data-kind="metric"] .ico{color:var(--accent);background:rgba(94,227,161,.1);border-color:rgba(94,227,161,.2)}
  .node[data-kind="sink"] .ico{color:var(--pink);background:rgba(255,126,182,.1);border-color:rgba(255,126,182,.2)}
  .node[data-kind="ai"] .ico{color:var(--running);background:rgba(240,180,41,.1);border-color:rgba(240,180,41,.2)}

  /* metric big number */
  .node.metric{width:170px}
  .node.metric .big{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1}
  .node.metric .big.up{color:var(--accent)} .node.metric .big.down{color:var(--blue)}
  .node.metric .lbl{font-size:10px;color:var(--txt-dim);margin-top:4px}

  /* ports */
  .port{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--panel2);
    border:1.5px solid var(--idle);top:50%;transform:translateY(-50%);z-index:3}
  .port.in{left:-5px}.port.out{right:-5px}
  .node[data-status="success"] .port{border-color:var(--accent)}

  /* AI mini-chart (AI reconciliation live trend) */
  #aicanvas{display:block;width:100%;height:54px;background:rgba(0,0,0,.25);border-radius:5px;margin-top:2px}

  /* edge schema tooltip */
  #schema{position:fixed;z-index:60;pointer-events:none;display:none;
    background:var(--panel);border:1px solid var(--accent);border-radius:7px;padding:8px 11px;
    font-size:10.5px;color:var(--txt);box-shadow:0 8px 26px rgba(0,0,0,.6);max-width:280px}
  #schema .h{color:var(--accent);font-weight:600;margin-bottom:5px;font-size:10px;letter-spacing:.4px}
  #schema .row{color:var(--txt-dim);line-height:1.6}
  #schema .row .key{color:var(--cyan)} #schema .row .ty{color:var(--purple)}

  /* hit areas for edges (transparent wide strokes) */
  .ehit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:help}

  /* ---------- Detail panel ---------- */
  #panel{
    position:fixed;top:46px;right:0;bottom:0;width:380px;z-index:50;
    background:linear-gradient(180deg,#0c111a,#0a0e15);
    border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.5)
  }
  #panel.open{transform:translateX(0)}
  #panel .ph{display:flex;align-items:flex-start;gap:11px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  #panel .ph .ico{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:19px;background:rgba(255,255,255,.04);border:1px solid var(--line);flex:none}
  #panel .ph .name{font-size:15px;font-weight:700;color:#fff;line-height:1.3}
  #panel .ph .meta{font-size:10.5px;color:var(--txt-dim);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  #panel .ph .meta span{display:inline-flex;align-items:center;gap:4px}
  #pclose{margin-left:auto;cursor:pointer;color:var(--txt-dim);font-size:18px;line-height:1;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;flex:none}
  #pclose:hover{background:var(--panel2);color:#fff}
  #pbody{overflow-y:auto;padding:16px 18px 28px;flex:1}
  #pbody::-webkit-scrollbar{width:8px}#pbody::-webkit-scrollbar-thumb{background:#1c2530;border-radius:4px}
  .sec{margin-bottom:18px}
  .sec h4{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:9px;
    display:flex;align-items:center;gap:7px}
  .sec h4::after{content:'';flex:1;height:1px;background:var(--line)}
  .desc{font-size:12.5px;line-height:1.7;color:var(--txt)}
  .kv{display:flex;font-size:11.5px;padding:6px 0;border-bottom:1px solid rgba(31,39,51,.6)}
  .kv .k{color:var(--txt-dim);width:104px;flex:none}
  .kv .v{color:var(--txt);flex:1}
  .kv .v b{color:var(--accent)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:10.5px;padding:4px 9px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--txt-dim)}
  .tag.hl{color:var(--cyan);border-color:rgba(54,217,217,.3);background:rgba(54,217,217,.06)}
  .ach{display:flex;gap:9px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(31,39,51,.6)}
  .ach .n{font-size:16px;font-weight:700;color:var(--accent);min-width:62px;font-variant-numeric:tabular-nums}
  .ach .t{font-size:11.5px;color:var(--txt);line-height:1.5}
  .logbox{background:#070a0f;border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:10.5px;line-height:1.7}
  .logbox .l{color:var(--txt-dim);white-space:pre-wrap}
  .logbox .l .t{color:var(--txt-faint)} .logbox .l .ok{color:var(--accent)} .logbox .l .w{color:var(--running)}

  /* ---------- Minimap ---------- */
  #minimap{position:fixed;left:14px;bottom:14px;width:200px;height:130px;z-index:40;
    background:rgba(8,11,16,.85);border:1px solid var(--line);border-radius:8px;overflow:hidden;
    box-shadow:0 8px 28px rgba(0,0,0,.5);backdrop-filter:blur(4px)}
  #minimap .mh{font-size:9px;letter-spacing:1px;color:var(--txt-faint);padding:5px 8px;border-bottom:1px solid var(--line);
    text-transform:uppercase;display:flex;justify-content:space-between}
  #mmsvg{display:block;width:100%;height:calc(100% - 22px);cursor:pointer}
  #mmview{fill:rgba(94,227,161,.1);stroke:var(--accent);stroke-width:1.2}

  /* ---------- Legend / breadcrumb ---------- */
  #legend{position:fixed;right:14px;bottom:14px;z-index:40;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;
    max-width:300px}
  #panel.open ~ #legend{right:394px}
  .leg{font-size:10px;color:var(--txt-dim);background:rgba(8,11,16,.8);border:1px solid var(--line);
    padding:5px 9px;border-radius:6px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
  .leg .d{width:7px;height:7px;border-radius:2px}

  /* zoom controls */
  #zoomctl{position:fixed;left:14px;top:60px;z-index:40;display:flex;flex-direction:column;gap:1px;
    background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  #zoomctl button{width:32px;height:30px;background:transparent;border:none;color:var(--txt-dim);
    font-family:var(--mono);font-size:15px;cursor:pointer;border-bottom:1px solid var(--line)}
  #zoomctl button:last-child{border-bottom:none;font-size:10px}
  #zoomctl button:hover{background:var(--panel2);color:#fff}
  #zlabel{position:fixed;left:54px;top:60px;z-index:40;font-size:10px;color:var(--txt-faint);
    background:rgba(8,11,16,.7);padding:3px 7px;border-radius:5px;border:1px solid var(--line)}

  /* run progress bar */
  #runbar{position:fixed;top:46px;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--running),var(--accent));
    z-index:55;transition:width .25s;box-shadow:0 0 8px var(--accent)}

  /* hint */
  #hint{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:35;font-size:11px;color:var(--txt-dim);
    background:rgba(8,11,16,.8);padding:6px 14px;border-radius:20px;border:1px solid var(--line);
    backdrop-filter:blur(4px);transition:opacity .5s;pointer-events:none}
  .kbd{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);font-size:10px;margin:0 2px}
</style>
</head>
<body>

<div id="toolbar">
  <div class="brand"><span class="dot"></span><b>park_yangha</b><span class="path">/ notion-os.dag</span></div>
  <div class="tb-sep"></div>
  <div class="tb-meta">
    <span><span class="k">project:</span> <span class="v">Notion OS</span></span>
    <span><span class="k">domain:</span> <span class="v">조직 운영 시스템 · 의사결정 OS</span></span>
    <span><span class="k">schedule:</span> <span class="v">@continuous</span></span>
  </div>
  <div class="spacer"></div>
  <div class="banner"><span class="ok"></span>SSOT: Notion · GitHub · Drive · 운영 중</div>
  <button class="btn run" id="runBtn"><span class="tri">&#9654;</span> RUN PIPELINE</button>
  <button class="btn-ghost" id="resetBtn" title="reset view">&#10562; fit</button>
</div>
<div id="runbar"></div>

<div id="stage">
  <canvas id="gridbg"></canvas>
  <div id="world">
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div id="zoomctl">
  <button id="zin">+</button>
  <button id="zout">&#8722;</button>
  <button id="zfit">FIT</button>
</div>
<div id="zlabel">100%</div>

<div id="hint">드래그로 이동 · 휠로 줌 · 노드 클릭으로 상세 · <span class="kbd">RUN</span> 으로 파이프라인 실행</div>

<div id="schema"></div>

<div id="minimap">
  <div class="mh"><span>MINIMAP</span><span id="mmstat">overview</span></div>
  <svg id="mmsvg"></svg>
</div>

<div id="legend">
  <span class="leg"><span class="d" style="background:var(--blue)"></span>input</span>
  <span class="leg"><span class="d" style="background:var(--purple)"></span>decision</span>
  <span class="leg"><span class="d" style="background:var(--cyan)"></span>execution</span>
  <span class="leg"><span class="d" style="background:var(--running)"></span>ai</span>
  <span class="leg"><span class="d" style="background:var(--accent)"></span>metric</span>
  <span class="leg"><span class="d" style="background:var(--pink)"></span>sink</span>
</div>

<aside id="panel">
  <div class="ph">
    <div class="ico" id="picon">&#11041;</div>
    <div>
      <div class="name" id="pname">node</div>
      <div class="meta" id="pmeta"></div>
    </div>
    <div id="pclose">&#10005;</div>
  </div>
  <div id="pbody"></div>
</aside>

<script>
//==================================================================
//  DATA — Notion OS : 조직 운영 시스템 DAG
//  스타트업의 빠른 의사결정이 정보 유실 없이 목표·실행·회고로 이어지는 조직 운영 OS
//==================================================================
var NODES = [
  // ---- SOURCE : 입력 ----
  { id:'src_meeting', kind:'source', col:0, row:0, type:'extract', icon:'📋', name:'Meeting',
    sub:'팀 회의 · 스탠드업 · 스프린트 플래닝 인풋', dur:'realtime', runs:'src.meeting.0001',
    desc:'모든 정보 흐름의 출발점. 회의에서 오고가는 논의·결정 후보·액션을 구조화된 포맷으로 캡처한다. Notion 회의록 DB에 자동 적재되며 AI 레이어가 결정 후보를 추출한다.',
    kv:[['source type','meeting notes'],['포맷','Notion DB · 구조화 템플릿'],['freshness','per session']],
    tags:['회의록','스탠드업','스프린트 플래닝','Notion'] },

  { id:'src_github', kind:'source', col:0, row:1, type:'extract', icon:'&#128570;', name:'GitHub',
    sub:'PR · 커밋 · 이슈 — 코드 정본(SSOT)', dur:'webhook', runs:'src.github.0002',
    desc:'코드 단일 출처(SSOT). PR 머지 이벤트가 AI 자동화 레이어를 트리거해 PRD 변경로그를 갱신하고 개발 뉴스를 요약한다. 이슈는 백로그와 실시간 동기화된다.',
    kv:[['source type','code SSOT'],['트리거','PR merge · issue close'],['연동','Runbook · PRD · Backlog']],
    tags:['GitHub','PR','이슈','코드SSOT','webhook'] },

  // ---- DECISION OS ----
  { id:'dec_ledger', kind:'decision', col:1, row:0, type:'transform', icon:'&#128220;', name:'Decision Ledger',
    sub:'모든 결정의 단일 기록부 — 맥락·근거·책임자', dur:'88ms', runs:'dec.ledger.v1',
    desc:'Decision OS의 핵심. 회의에서 도출된 결정 후보가 AI 추출을 거쳐 이곳에 영구 기록된다. 결정 날짜·맥락·찬반 근거·책임자·리뷰 일정을 함께 저장해 정보 유실을 방지한다.',
    kv:[['저장소','Notion Decision DB'],['필드','날짜 / 맥락 / 책임자 / 리뷰 기한'],['연동','Action Items · OKR']],
    tags:['Decision Ledger','의사결정','SSOT','맥락 보존','책임자'],

//==================================================================
//  LAYOUT
//==================================================================
var COLX = [80, 370, 700, 1010, 1320, 1650];
var ROWH = 155;
var NODE_W = 230, NODE_MW = 170;
var nodeById = {};
NODES.forEach(function(n){ nodeById[n.id]=n; });

function layout(){
  var colRows = {};
  NODES.forEach(function(n){ colRows[n.col]=(colRows[n.col]||0); colRows[n.col]=Math.max(colRows[n.col], n.row+1); });
  var maxRows = Math.max.apply(null, Object.values(colRows));
  NODES.forEach(function(n){
    var rows = colRows[n.col];
    var colHeight = rows*ROWH;
    var maxHeight = maxRows*ROWH;
    var offset = (maxHeight-colHeight)/2;
    n.x = COLX[n.col];
    n.y = 40 + offset + n.row*ROWH;
    n.w = n.metric ? NODE_MW : NODE_W;
    n.h = n.ml ? 200 : (n.metric ? 96 : 120);
  });
}
layout();

function worldBounds(){
  var maxX=0, maxY=0;
  NODES.forEach(function(n){ maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h); });
  return {w:maxX+120, h:maxY+120};
}
var WB = worldBounds();

var nodesLayer = document.getElementById('nodes');
var edgesSvg = document.getElementById('edges');
edgesSvg.setAttribute('width', WB.w);
edgesSvg.setAttribute('height', WB.h);

function statusPill(status){
  var map = {success:['success','SUCCESS'],running:['running','RUNNING'],queued:['queued','QUEUED'],idle:['idle','IDLE']};
  var ct = map[status]||map.idle;
  var c=ct[0], t=ct[1];
  return '<span class="pill '+c+'"><span class="d"></span>'+t+'</span>';
}

var TYPE_LABEL = {extract:'EXTRACT',transform:'TRANSFORM',load:'LOAD',ml:'AI.AUTO',deploy:'DEPLOY'};

NODES.forEach(function(n){
  var el = document.createElement('div');
  el.className = 'node'+(n.metric?' metric':'');
  el.dataset.id = n.id; el.dataset.kind = n.kind;
  n.status = n.status || 'success';
  el.dataset.status = n.status;
  el.style.left = n.x+'px'; el.style.top = n.y+'px'; el.style.width = n.w+'px';

var NS='http://www.w3.org/2000/svg';
function edgePath(a,b){
  var x1=a.x+a.w, y1=a.y+a.h/2;
  var x2=b.x, y2=b.y+b.h/2;
  var dx=Math.max(40,(x2-x1)*0.5);
  return 'M '+x1+','+y1+' C '+(x1+dx)+','+y1+' '+(x2-dx)+','+y2+' '+x2+','+y2;
}

var defs=document.createElementNS(NS,'defs');
defs.innerHTML=
  '<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
    '<path d="M0,0 L10,5 L0,10 z" fill="#2c3848"/>'+
  '</marker>'+
  '<marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'+
    '<path d="M0,0 L10,5 L0,10 z" fill="#5ee3a1"/>'+
  '</marker>'+
  '<linearGradient id="eg" x1="0" y1="0" x2="1" y2="0">'+
    '<stop offset="0" stop-color="#243040"/><stop offset="1" stop-color="#2c3a4c"/>'+
  '</linearGradient>';
edgesSvg.appendChild(defs);

  {h:'schema: meeting_record',rows:[['decision_candidate','string'],['action_item','string'],['owner','string'],['ts','datetime']]},

];

var edgeEls=[];
EDGES.forEach(function(e,i){
  var a=nodeById[e[0]], b=nodeById[e[1]];
  if(!a||!b) return;
  var d=edgePath(a,b);
  var p=document.createElementNS(NS,'path');
  p.setAttribute('d',d); p.setAttribute('fill','none');
  p.setAttribute('stroke','url(#eg)'); p.setAttribute('stroke-width','1.4');
  p.setAttribute('marker-end','url(#arrow)');
  p.setAttribute('opacity','0.85');
  edgesSvg.appendChild(p);

  var hit=document.createElementNS(NS,'path');

  var schema = SCHEMAS[i % SCHEMAS.length];

  });
  hit.addEventListener('mouseleave',function(){
    hideSchema(); p.setAttribute('stroke','url(#eg)'); p.setAttribute('stroke-width','1.4'); p.setAttribute('marker-end','url(#arrow)');
  });
  edgesSvg.appendChild(hit);

  var tok=document.createElementNS(NS,'circle');
  tok.setAttribute('r','2.6'); tok.setAttribute('fill','#5ee3a1');
  tok.style.filter='drop-shadow(0 0 4px #5ee3a1)';

  edgeEls.push({a:e[0],b:e[1],path:p,len:p.getTotalLength(),tok:tok,phase:Math.random(),speed:0.10+Math.random()*0.13,targetSpeed:0.10+Math.random()*0.13,active:true});

//==================================================================
//  TOKEN ANIMATION (60fps rAF + dt) — 자동 시작, 루프 무한 반복
//==================================================================
var lastT=performance.now();
function animate(t){
  var dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  for(var i=0;i<edgeEls.length;i++){
    var e=edgeEls[i];
    if(!e.active){ e.tok.style.opacity=0; continue; }
    // 목표 속도로 부드럽게 보간 (speed 점프 제거)
    e.speed += (e.targetSpeed - e.speed) * Math.min(1, dt * 4);
    e.phase += e.speed*dt;
    if(e.phase>1) e.phase-=1;
    var pt=e.path.getPointAtLength(e.phase*e.len);
    e.tok.setAttribute('cx',pt.x); e.tok.setAttribute('cy',pt.y);
    var edge = Math.min(e.phase, 1-e.phase);
    e.tok.style.opacity = Math.min(1, edge*8)*0.95;
  }
  drawAI(t);
  tickRunSweep(dt);
  tickMetrics(t);
  tickEventLog(t);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

var aiCanvas=null, aiCtx=null, aiData=[], aiNextSampleAt=0;
var AI_MAX=80; // 화면에 보이는 샘플 수

function aiSample(t){
  // 세 파이프라인 진동을 시간 기반으로 생성
  var s = t * 0.001;
  var v = 0.38 + 0.48*(
    Math.sin(s*2.1)*0.38 +
    Math.cos(s*3.7+1.2)*0.28 +
    Math.sin(s*5.9+2.5)*0.18 +
    (Math.random()-0.5)*0.08
  );
  return Math.max(0.04, Math.min(0.96, v));
}

function initAI(){
  aiCanvas=document.getElementById('aicanvas');
  if(!aiCanvas) return;
  var dpr=window.devicePixelRatio||1;
  aiCanvas.width=206*dpr; aiCanvas.height=54*dpr;
  aiCtx=aiCanvas.getContext('2d'); aiCtx.scale(dpr,dpr);
  aiData=[];
  var now=performance.now();
  for(var i=0;i<AI_MAX;i++) aiData.push(aiSample(now - (AI_MAX-i)*83));
  aiNextSampleAt=now;
}

function drawAI(t){
  if(!aiCtx) return;
  // 절대 시간 기준 ~12fps 샘플 추가
  if(t >= aiNextSampleAt){
    aiData.push(aiSample(t));
    if(aiData.length > AI_MAX) aiData.shift();
    aiNextSampleAt = t + 83;
  }
  var W=206,H=54,pad=4;
  aiCtx.clearRect(0,0,W,H);
  aiCtx.strokeStyle='rgba(255,255,255,.04)'; aiCtx.lineWidth=1;
  for(var g=1;g<4;g++){
    var gy=pad+(H-2*pad)*g/4;
    aiCtx.beginPath(); aiCtx.moveTo(pad,gy); aiCtx.lineTo(W-pad,gy); aiCtx.stroke();
  }
  var n=aiData.length;
  if(n<2) return;
  // area fill
  aiCtx.beginPath();
  for(var i=0;i<n;i++){
    var x=pad+(W-2*pad)*i/(AI_MAX-1);
    var yv=pad+(H-2*pad)*(1-aiData[i]);
    if(i===0){ aiCtx.moveTo(x,yv); } else { aiCtx.lineTo(x,yv); }
  }
  var lxA=pad+(W-2*pad)*(n-1)/(AI_MAX-1);
  aiCtx.lineTo(lxA,H-pad); aiCtx.lineTo(pad,H-pad); aiCtx.closePath();
  var grad=aiCtx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(240,180,41,.28)'); grad.addColorStop(1,'rgba(240,180,41,0)');
  aiCtx.fillStyle=grad; aiCtx.fill();
  // line
  aiCtx.beginPath();
  for(var j=0;j<n;j++){
    var xj=pad+(W-2*pad)*j/(AI_MAX-1);
    var yj=pad+(H-2*pad)*(1-aiData[j]);
    if(j===0){ aiCtx.moveTo(xj,yj); } else { aiCtx.lineTo(xj,yj); }
  }
  aiCtx.strokeStyle='#f0b429'; aiCtx.lineWidth=1.6; aiCtx.lineJoin='round'; aiCtx.stroke();
  // head dot
  var hx=pad+(W-2*pad)*(n-1)/(AI_MAX-1);
  var hy=pad+(H-2*pad)*(1-aiData[n-1]);
  aiCtx.beginPath(); aiCtx.arc(hx,hy,2.4,0,7); aiCtx.fillStyle='#5ee3a1'; aiCtx.fill();
  aiCtx.fillStyle='rgba(201,212,227,.5)'; aiCtx.font='8px monospace';
  aiCtx.fillText('ai.pipelines · throughput', 6, 11);
  aiCtx.fillStyle='#5ee3a1';
  aiCtx.fillText('AUTO', W-34, 11);
}

//==================================================================
//  RUN SWEEP — rAF + dt 기반 위상정렬 스윕 (끊김 없는 진행)
//==================================================================
var sweepState = null; // { order, idx, accum, nodeDur, nodeRunDur, total }

function tickRunSweep(dt){
  if(!sweepState) return;
  var sw = sweepState;
  if(sw.idx >= sw.order.length){
    // 완료 처리
    runbar.style.width = '100%';
    if(!sw.finishing){
      sw.finishing = true;
      sw.finishAccum = 0;
    }
    sw.finishAccum += dt;
    if(sw.finishAccum > 0.45){
      runbar.style.width = '0%';
      edgeEls.forEach(function(e){
        e.active = true;
        e.targetSpeed = 0.10 + Math.random()*0.13;
      });
      runBtn.classList.remove('running');
      runBtn.innerHTML = '<span class="tri">&#10003;</span> RUN AGAIN';
      running = false;
      sweepState = null;
      // 자동 재시작: 2초 후
      setTimeout(runPipeline, 2000);
    }
    return;
  }
  sw.accum += dt;
  var n = nodeById[sw.order[sw.idx]];
  // 아직 이 노드의 'running' 단계
  if(sw.phase === 'run'){
    if(sw.accum >= sw.nodeRunDur){
      // 이 노드 완료
      n.status = 'success'; n.el.dataset.status = 'success'; updatePill(n);
      edgeEls.forEach(function(e){
        if(e.b === n.id) e.targetSpeed = 0.12 + Math.random()*0.10;
      });
      sw.idx++;
      sw.accum = 0;
      sw.phase = 'run';
      runbar.style.width = ((sw.idx / sw.total) * 100) + '%';
      if(sw.idx < sw.order.length){
        var next = nodeById[sw.order[sw.idx]];
        next.status = 'running'; next.el.dataset.status = 'running'; updatePill(next);
        sw.nodeRunDur = next.metric ? 0.17 : 0.28 + Math.random()*0.12;
        edgeEls.forEach(function(e){
          if(e.b === next.id){ e.active = true; e.phase = 0; e.targetSpeed = 0.55 + Math.random()*0.3; }
        });
      }
    }
  }
}

function runPipeline(){
  if(running) return;
  running = true;
  runBtn.classList.add('running');
  runBtn.innerHTML = '<span class="tri">&#9632;</span> RUNNING&#8230;';
  NODES.forEach(function(n){ n.status='queued'; n.el.dataset.status='queued'; updatePill(n); });
  edgeEls.forEach(function(e){ e.active=false; e.targetSpeed=e.speed; });
  var order = topoOrder();
  var total = order.length;
  runbar.style.width = '0%';
  // 첫 노드 시작
  var first = nodeById[order[0]];
  first.status = 'running'; first.el.dataset.status = 'running'; updatePill(first);
  edgeEls.forEach(function(e){
    if(e.b === first.id){ e.active=true; e.phase=0; e.targetSpeed=0.55+Math.random()*0.3; }
  });
  sweepState = {
    order: order,
    total: total,
    idx: 0,
    accum: 0,
    phase: 'run',
    nodeRunDur: first.metric ? 0.17 : 0.28 + Math.random()*0.12,
    finishing: false,
    finishAccum: 0,
  };
}

var stage=document.getElementById('stage');
var world=document.getElementById('world');
var zlabel=document.getElementById('zlabel');
var scale=1, tx=0, ty=0;
function applyTransform(){
  world.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
  zlabel.textContent=Math.round(scale*100)+'%';
  drawGrid(); updateMinimap();
}
function fit(){
  var vw=stage.clientWidth, vh=stage.clientHeight;
  var s=Math.min(vw/(WB.w+60), vh/(WB.h+60), 1.2);
  scale=s;
  tx=(vw - WB.w*s)/2; ty=(vh - WB.h*s)/2;
  applyTransform();
}

var dragging=false, sx, sy, stx, sty, moved=false;
stage.addEventListener('mousedown',function(e){
  if(e.target.closest('.node')||e.target.closest('.ehit')) return;
  dragging=true; moved=false; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty;
  stage.classList.add('grabbing');
});
window.addEventListener('mousemove',function(e){
  if(!dragging) return;
  tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy);
  if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>3) moved=true;
  applyTransform();
});
window.addEventListener('mouseup',function(){ dragging=false; stage.classList.remove('grabbing'); });

stage.addEventListener('wheel',function(e){
  e.preventDefault();
  var rect=stage.getBoundingClientRect();
  var mx=e.clientX-rect.left, my=e.clientY-rect.top;
  var wx=(mx-tx)/scale, wy=(my-ty)/scale;
  var factor=e.deltaY<0?1.12:0.89;
  scale=Math.min(2.4,Math.max(0.25,scale*factor));
  tx=mx-wx*scale; ty=my-wy*scale;
  applyTransform();
},{passive:false});

document.getElementById('zin').onclick=function(){ zoomBtn(1.2); };
document.getElementById('zout').onclick=function(){ zoomBtn(0.83); };
document.getElementById('zfit').onclick=fit;
document.getElementById('zfit').textContent='FIT';
function zoomBtn(f){
  var cx=stage.clientWidth/2, cy=stage.clientHeight/2;
  var wx=(cx-tx)/scale, wy=(cy-ty)/scale;
  scale=Math.min(2.4,Math.max(0.25,scale*f));
  tx=cx-wx*scale; ty=cy-wy*scale; applyTransform();
}

var grid=document.getElementById('gridbg');
var gctx=grid.getContext('2d');
function sizeGrid(){
  var dpr=window.devicePixelRatio||1;
  grid.width=stage.clientWidth*dpr; grid.height=stage.clientHeight*dpr;
  grid.style.width=stage.clientWidth+'px'; grid.style.height=stage.clientHeight+'px';
  gctx.setTransform(dpr,0,0,dpr,0,0);
  drawGrid();
}
function drawGrid(){
  var w=stage.clientWidth, h=stage.clientHeight;
  gctx.clearRect(0,0,w,h);
  var step=40*scale;
  if(step<6) return;
  var ox=((tx%step)+step)%step, oy=((ty%step)+step)%step;
  gctx.strokeStyle='rgba(255,255,255,.025)'; gctx.lineWidth=1;
  gctx.beginPath();
  for(var x=ox;x<w;x+=step){ gctx.moveTo(x,0); gctx.lineTo(x,h); }
  for(var y=oy;y<h;y+=step){ gctx.moveTo(0,y); gctx.lineTo(w,y); }
  gctx.stroke();
  var mstep=step*5;
  var mox=((tx%mstep)+mstep)%mstep, moy=((ty%mstep)+mstep)%mstep;
  gctx.fillStyle='rgba(94,227,161,.10)';
  for(var xi=mox;xi<w;xi+=mstep){
    for(var yi=moy;yi<h;yi+=mstep){
      gctx.beginPath(); gctx.arc(xi,yi,1.3,0,7); gctx.fill();
    }
  }
}

var mmsvg=document.getElementById('mmsvg');
function buildMinimap(){
  mmsvg.innerHTML='';
  var bbox=mmsvg.getBoundingClientRect();
  var mw=bbox.width||200, mh=bbox.height||108;
  var s=Math.min(mw/WB.w, mh/WB.h)*0.92;
  var offx=(mw-WB.w*s)/2, offy=(mh-WB.h*s)/2;
  mmsvg._s=s; mmsvg._ox=offx; mmsvg._oy=offy;
  EDGES.forEach(function(e){
    var a=nodeById[e[0]], b=nodeById[e[1]]; if(!a||!b) return;
    var l=document.createElementNS(NS,'line');
    l.setAttribute('x1',offx+(a.x+a.w)*s); l.setAttribute('y1',offy+(a.y+a.h/2)*s);
    l.setAttribute('x2',offx+b.x*s); l.setAttribute('y2',offy+(b.y+b.h/2)*s);
    l.setAttribute('stroke','#2a3543'); l.setAttribute('stroke-width','0.6');
    mmsvg.appendChild(l);
  });
  var COLOR={source:'#4aa8ff',decision:'#b08cff',okr:'#36d9d9',metric:'#5ee3a1',sink:'#ff7eb6',ai:'#f0b429'};
  NODES.forEach(function(n){
    var r=document.createElementNS(NS,'rect');
    r.setAttribute('x',offx+n.x*s); r.setAttribute('y',offy+n.y*s);
    r.setAttribute('width',Math.max(3,n.w*s)); r.setAttribute('height',Math.max(2,n.h*s));
    r.setAttribute('rx','1.5'); r.setAttribute('fill',COLOR[n.kind]||'#888'); r.setAttribute('opacity','.85');
    r.dataset.id=n.id;
    mmsvg.appendChild(r);
  });
  var view=document.createElementNS(NS,'rect');
  view.setAttribute('id','mmview'); view.setAttribute('rx','2');
  mmsvg.appendChild(view);
}
function updateMinimap(){
  var view=document.getElementById('mmview'); if(!view) return;
  var s=mmsvg._s, offx=mmsvg._ox, offy=mmsvg._oy;
  if(!isFinite(s)||!scale||!isFinite(scale)||!stage.clientWidth||!stage.clientHeight) return;
  var vx=-tx/scale, vy=-ty/scale, vw=stage.clientWidth/scale, vh=stage.clientHeight/scale;
  view.setAttribute('x',offx+vx*s); view.setAttribute('y',offy+vy*s);
  view.setAttribute('width',vw*s); view.setAttribute('height',vh*s);
}
mmsvg.addEventListener('click',function(e){
  var rect=mmsvg.getBoundingClientRect();
  var s=mmsvg._s, offx=mmsvg._ox, offy=mmsvg._oy;
  var wx=((e.clientX-rect.left)-offx)/s, wy=((e.clientY-rect.top)-offy)/s;
  tx=stage.clientWidth/2 - wx*scale; ty=stage.clientHeight/2 - wy*scale;
  applyTransform();
});

    }).join('');
  var x=ev.clientX+14, y=ev.clientY+14;
  if(x+260>window.innerWidth) x=ev.clientX-260;
  schemaEl.style.left=x+'px'; schemaEl.style.top=y+'px';
}
function hideSchema(){ schemaEl.style.display='none'; }

//==================================================================
//  DETAIL PANEL

var panel=document.getElementById('panel');
var pbody=document.getElementById('pbody');
var selId=null;
function openPanel(id){
  var n=nodeById[id]; if(!n) return;
  if(selId) nodeById[selId].el.classList.remove('sel');
  selId=id; n.el.classList.add('sel');
  document.getElementById('picon').textContent=n.icon;
  document.getElementById('pname').textContent=n.name;
  var kindLabel={source:'SOURCE',decision:'DECISION',okr:'EXECUTION',metric:'METRIC',sink:'SINK',ai:'AI.AUTO'}[n.kind];
  document.getElementById('pmeta').innerHTML=
    '<span>'+statusPill(n.status)+'</span>'+
    '<span style="color:var(--txt-faint)">'+kindLabel+' · '+(TYPE_LABEL[n.type]||'TASK')+'</span>'+
    '<span style="color:var(--txt-faint)">&#9201; '+n.dur+'</span>';

  var html='';
  html+='<div class="sec"><h4>description</h4><div class="desc">'+n.desc+'</div></div>';
  if(n.kv){
    html+='<div class="sec"><h4>params</h4>';
    n.kv.forEach(function(kv){
      html+='<div class="kv"><span class="k">'+kv[0]+'</span><span class="v">'+kv[1]+'</span></div>';
    });
    html+='</div>';
  }
  if(n.ach){
    html+='<div class="sec"><h4>output metrics</h4>';
    n.ach.forEach(function(a){ html+='<div class="ach"><span class="n">'+a[0]+'</span><span class="t">'+a[1]+'</span></div>'; });
    html+='</div>';
  }
  if(n.tags){
    html+='<div class="sec"><h4>tags</h4><div class="tags">'+
      n.tags.map(function(t){ return '<span class="tag '+(n.kind==='okr'?'hl':'')+'">'+t+'</span>'; }).join('')+
      '</div></div>';
  }
  var up=EDGES.filter(function(e){ return e[1]===id; }).map(function(e){ return nodeById[e[0]]?nodeById[e[0]].name:null; }).filter(Boolean);
  var down=EDGES.filter(function(e){ return e[0]===id; }).map(function(e){ return nodeById[e[1]]?nodeById[e[1]].name:null; }).filter(Boolean);
  html+='<div class="sec"><h4>dependencies</h4>';
  html+='<div class="kv"><span class="k">upstream &#8593;</span><span class="v">'+(up.length?up.join(', '):'&#8212; (root source)')+'</span></div>';
  html+='<div class="kv"><span class="k">downstream &#8595;</span><span class="v">'+(down.length?down.join(', '):'&#8212; (terminal sink)')+'</span></div>';
  html+='</div>';
  html+='<div class="sec"><h4>task log</h4><div class="logbox">'+
    '<div class="l"><span class="t">['+n.runs+']</span> queued &#8594; scheduler</div>'+
    '<div class="l"><span class="t">[exec]</span> task_instance started</div>'+
    (n.status==='running'
      ? '<div class="l w">[exec] running&#8230; (live)</div>'
      : '<div class="l ok">[exec] marked SUCCESS in '+n.dur+'</div>')+
    '</div></div>';
  pbody.innerHTML=html;
  pbody.scrollTop=0;
  panel.classList.add('open');
  if(n.ml) requestAnimationFrame(function(){ if(document.getElementById('aicanvas')) initAI(); });
}
function closePanel(){ panel.classList.remove('open'); if(selId){ nodeById[selId].el.classList.remove('sel'); selId=null; } }
document.getElementById('pclose').onclick=closePanel;
stage.addEventListener('click',function(e){ if(!moved && !e.target.closest('.node')) closePanel(); });

//==================================================================
//  topoOrder / 공통 선언 — sweep에서 참조
//==================================================================
function topoOrder(){
  var indeg={}, adj={};
  NODES.forEach(function(n){ indeg[n.id]=0; adj[n.id]=[]; });
  EDGES.forEach(function(e){ if(adj[e[0]]&&indeg[e[1]]!=null){ adj[e[0]].push(e[1]); indeg[e[1]]++; } });
  var q=NODES.filter(function(n){ return indeg[n.id]===0; }).map(function(n){ return n.id; });
  var order=[];
  while(q.length){
    var id=q.shift(); order.push(id);
    (adj[id]||[]).forEach(function(t){ if(--indeg[t]===0) q.push(t); });
  }
  return order;
}
var running=false;
var runBtn=document.getElementById('runBtn');
var runbar=document.getElementById('runbar');
runBtn.onclick=runPipeline;

function updatePill(n){
  if(n.metric) return;
  var pill=n.el.querySelector('.pill');
  if(!pill) return;
  var map={success:['success','SUCCESS'],running:['running','RUNNING'],queued:['queued','QUEUED'],idle:['idle','IDLE']};
  var ct=map[n.status]||map.idle;
  pill.className='pill '+ct[0];
  pill.innerHTML='<span class="d"></span>'+ct[1];
}

//==================================================================
//  INIT — 자동재생 보장 (레이아웃 게이트 + setTimeout 재시도)
//==================================================================
var booted=false;
function boot(){
  if(booted) return;
  booted=true;
  sizeGrid();
  buildMinimap();
  fit();
  buildLogEl();
  // exec_runbook 은 현재 운영 중 상태
  var rb=nodeById['exec_runbook'];
  rb.status='running'; rb.el.dataset.status='running'; updatePill(rb);
  // 힌트 자동 숨김
  setTimeout(function(){ var h=document.getElementById('hint'); if(h) h.style.opacity='0'; }, 6500);
  // 자동 실행 스윕 시작 — 레이아웃이 준비된 후 바로 시작
  setTimeout(runPipeline, 800);
}

window.addEventListener('resize',function(){ sizeGrid(); buildMinimap(); updateMinimap(); });

// 1차: 폰트 로드 완료 후 boot
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(boot);
} else { boot(); }
// 2차 fallback: 폰트 이벤트가 오지 않는 헤드리스 환경 대비
setTimeout(function(){ if(!booted) boot(); }, 300);
// 3차 fallback: 레이아웃이 아직 미완료인 경우 재시도
setTimeout(function(){ if(!booted) boot(); }, 800);
</script>
