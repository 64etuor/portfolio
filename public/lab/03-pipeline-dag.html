<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>park_yangha.dag — Data Pipeline Portfolio</title>
<style>
  :root{
    --bg:#0a0e14;
    --bg2:#0d1117;
    --panel:#10151d;
    --panel2:#161c26;
    --grid:#141b25;
    --line:#1f2733;
    --txt:#c9d4e3;
    --txt-dim:#6b7787;
    --txt-faint:#414c5c;
    --accent:#5ee3a1;     /* success green */
    --running:#f0b429;    /* running amber */
    --idle:#3b4756;       /* idle */
    --blue:#4aa8ff;
    --purple:#b08cff;
    --pink:#ff7eb6;
    --cyan:#36d9d9;
    --red:#ff6363;
    --mono:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,'Cascadia Code',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--mono);
    word-break:keep-all;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* ---------- Top toolbar ---------- */
  #toolbar{
    position:fixed;top:0;left:0;right:0;height:46px;z-index:40;
    display:flex;align-items:center;gap:14px;padding:0 14px;
    background:linear-gradient(180deg,#0e141d,#0b1018);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(255,255,255,.02);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px;letter-spacing:.3px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .brand b{color:#fff}
  .brand .path{color:var(--txt-dim);font-weight:400}
  .tb-sep{width:1px;height:22px;background:var(--line)}
  .tb-meta{font-size:11px;color:var(--txt-dim);display:flex;gap:14px;align-items:center}
  .tb-meta .k{color:var(--txt-faint)}
  .tb-meta .v{color:var(--txt)}
  .banner{
    display:flex;align-items:center;gap:7px;font-size:11px;padding:4px 10px;border-radius:5px;
    background:rgba(94,227,161,.08);border:1px solid rgba(94,227,161,.25);color:var(--accent)
  }
  .banner .ok{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .spacer{flex:1}
  .btn{
    font-family:var(--mono);font-size:12px;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:7px 12px;border-radius:6px;
    display:flex;align-items:center;gap:7px;transition:.14s;user-select:none
  }
  .btn:hover{border-color:#33414f;background:#1b2330}
  .btn.run{border-color:rgba(94,227,161,.4);color:var(--accent);background:rgba(94,227,161,.06)}
  .btn.run:hover{background:rgba(94,227,161,.14);box-shadow:0 0 14px rgba(94,227,161,.2)}
  .btn.run.running{border-color:rgba(240,180,41,.5);color:var(--running);background:rgba(240,180,41,.08)}
  .btn .tri{font-size:10px}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--txt-dim);padding:7px 9px}
  .btn-ghost:hover{background:var(--panel2);color:var(--txt)}

  /* ---------- Canvas ---------- */
  #stage{position:fixed;inset:46px 0 0 0;overflow:hidden;cursor:grab;
    background:
      radial-gradient(1200px 700px at 70% 10%, rgba(74,168,255,.05), transparent 60%),
      radial-gradient(900px 600px at 10% 90%, rgba(176,140,255,.05), transparent 60%),
      var(--bg);
  }
  #stage.grabbing{cursor:grabbing}
  #stage:active{cursor:grabbing}
  #gridbg{position:absolute;inset:0;pointer-events:none;z-index:0}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;z-index:1;will-change:transform}
  #edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:1}
  #nodes{position:absolute;top:0;left:0;z-index:2}

  /* ---------- Node card ---------- */
  .node{
    position:absolute;width:230px;border-radius:9px;overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);
    box-shadow:0 6px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);
    transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .node:hover{border-color:#3a4a5c;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 0 1px rgba(94,227,161,.08)}
  .node.sel{border-color:var(--accent);box-shadow:0 12px 36px rgba(0,0,0,.7),0 0 0 1px var(--accent),0 0 22px rgba(94,227,161,.18)}
  .node .top{display:flex;align-items:center;gap:8px;padding:9px 11px 8px;border-bottom:1px solid var(--line)}
  .node .ico{
    width:26px;height:26px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:13px;background:rgba(255,255,255,.04);border:1px solid var(--line)
  }
  .node .ttl{flex:1;min-width:0}
  .node .ttl .name{font-size:12.5px;font-weight:600;color:#e7eef7;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .ttl .type{font-size:9.5px;color:var(--txt-faint);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
  .node .body{padding:8px 11px 10px}
  .node .sub{font-size:10.5px;color:var(--txt-dim);line-height:1.5}
  .node .foot{display:flex;align-items:center;gap:8px;padding:7px 11px;border-top:1px solid var(--line);
    background:rgba(0,0,0,.18);font-size:9.5px;color:var(--txt-faint)}
  .node .foot .dur{margin-left:auto;color:var(--txt-dim)}
  .node .runid{color:var(--txt-faint);font-family:var(--mono)}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;padding:2px 7px;border-radius:20px;
    letter-spacing:.3px;font-weight:600}
  .pill .d{width:5px;height:5px;border-radius:50%}
  .pill.success{color:var(--accent);background:rgba(94,227,161,.1);border:1px solid rgba(94,227,161,.25)}
  .pill.success .d{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .pill.running{color:var(--running);background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.3)}
  .pill.running .d{background:var(--running);box-shadow:0 0 6px var(--running);animation:blink .8s infinite}
  .pill.queued{color:var(--blue);background:rgba(74,168,255,.1);border:1px solid rgba(74,168,255,.25)}
  .pill.queued .d{background:var(--blue)}
  .pill.idle{color:var(--txt-dim);background:rgba(120,135,150,.08);border:1px solid var(--line)}
  .pill.idle .d{background:var(--idle)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* node status accents (left bar) */
  .node::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--idle);transition:.3s}
  .node[data-status="success"]::before{background:var(--accent);box-shadow:0 0 12px rgba(94,227,161,.5)}
  .node[data-status="running"]::before{background:var(--running);box-shadow:0 0 12px rgba(240,180,41,.6);animation:flow 1s linear infinite}
  .node[data-status="queued"]::before{background:var(--blue)}
  @keyframes flow{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}

  /* group tint by kind */
  .node[data-kind="source"] .ico{color:var(--blue);background:rgba(74,168,255,.1);border-color:rgba(74,168,255,.2)}
  .node[data-kind="exp"] .ico{color:var(--purple);background:rgba(176,140,255,.1);border-color:rgba(176,140,255,.2)}
  .node[data-kind="skill"] .ico{color:var(--cyan);background:rgba(54,217,217,.1);border-color:rgba(54,217,217,.2)}
  .node[data-kind="metric"] .ico{color:var(--accent);background:rgba(94,227,161,.1);border-color:rgba(94,227,161,.2)}
  .node[data-kind="sink"] .ico{color:var(--pink);background:rgba(255,126,182,.1);border-color:rgba(255,126,182,.2)}
  .node[data-kind="ml"] .ico{color:var(--running);background:rgba(240,180,41,.1);border-color:rgba(240,180,41,.2)}

  /* metric big number */
  .node.metric{width:170px}
  .node.metric .big{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1}
  .node.metric .big.up{color:var(--accent)} .node.metric .big.down{color:var(--blue)}
  .node.metric .lbl{font-size:10px;color:var(--txt-dim);margin-top:4px}

  /* ports */
  .port{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--panel2);
    border:1.5px solid var(--idle);top:50%;transform:translateY(-50%);z-index:3}
  .port.in{left:-5px}.port.out{right:-5px}
  .node[data-status="success"] .port{border-color:var(--accent)}

  /* ML mini-chart */
  #mlcanvas{display:block;width:100%;height:54px;background:rgba(0,0,0,.25);border-radius:5px;margin-top:2px}

  /* edge schema tooltip */
  #schema{position:fixed;z-index:60;pointer-events:none;display:none;
    background:var(--panel);border:1px solid var(--accent);border-radius:7px;padding:8px 11px;
    font-size:10.5px;color:var(--txt);box-shadow:0 8px 26px rgba(0,0,0,.6);max-width:280px}
  #schema .h{color:var(--accent);font-weight:600;margin-bottom:5px;font-size:10px;letter-spacing:.4px}
  #schema .row{color:var(--txt-dim);line-height:1.6}
  #schema .row .key{color:var(--cyan)} #schema .row .ty{color:var(--purple)}

  /* hit areas for edges (transparent wide strokes) */
  .ehit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:help}

  /* ---------- Detail panel ---------- */
  #panel{
    position:fixed;top:46px;right:0;bottom:0;width:380px;z-index:50;
    background:linear-gradient(180deg,#0c111a,#0a0e15);
    border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.5)
  }
  #panel.open{transform:translateX(0)}
  #panel .ph{display:flex;align-items:flex-start;gap:11px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  #panel .ph .ico{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:19px;background:rgba(255,255,255,.04);border:1px solid var(--line);flex:none}
  #panel .ph .name{font-size:15px;font-weight:700;color:#fff;line-height:1.3}
  #panel .ph .meta{font-size:10.5px;color:var(--txt-dim);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  #panel .ph .meta span{display:inline-flex;align-items:center;gap:4px}
  #pclose{margin-left:auto;cursor:pointer;color:var(--txt-dim);font-size:18px;line-height:1;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;flex:none}
  #pclose:hover{background:var(--panel2);color:#fff}
  #pbody{overflow-y:auto;padding:16px 18px 28px;flex:1}
  #pbody::-webkit-scrollbar{width:8px}#pbody::-webkit-scrollbar-thumb{background:#1c2530;border-radius:4px}
  .sec{margin-bottom:18px}
  .sec h4{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:9px;
    display:flex;align-items:center;gap:7px}
  .sec h4::after{content:'';flex:1;height:1px;background:var(--line)}
  .desc{font-size:12.5px;line-height:1.7;color:var(--txt)}
  .kv{display:flex;font-size:11.5px;padding:6px 0;border-bottom:1px solid rgba(31,39,51,.6)}
  .kv .k{color:var(--txt-dim);width:104px;flex:none}
  .kv .v{color:var(--txt);flex:1}
  .kv .v b{color:var(--accent)}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:10.5px;padding:4px 9px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--txt-dim)}
  .tag.hl{color:var(--cyan);border-color:rgba(54,217,217,.3);background:rgba(54,217,217,.06)}
  .ach{display:flex;gap:9px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(31,39,51,.6)}
  .ach .n{font-size:16px;font-weight:700;color:var(--accent);min-width:62px;font-variant-numeric:tabular-nums}
  .ach .t{font-size:11.5px;color:var(--txt);line-height:1.5}
  .logbox{background:#070a0f;border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:10.5px;line-height:1.7}
  .logbox .l{color:var(--txt-dim);white-space:pre-wrap}
  .logbox .l .t{color:var(--txt-faint)} .logbox .l .ok{color:var(--accent)} .logbox .l .w{color:var(--running)}

  /* ---------- Minimap ---------- */
  #minimap{position:fixed;left:14px;bottom:14px;width:200px;height:130px;z-index:40;
    background:rgba(8,11,16,.85);border:1px solid var(--line);border-radius:8px;overflow:hidden;
    box-shadow:0 8px 28px rgba(0,0,0,.5);backdrop-filter:blur(4px)}
  #minimap .mh{font-size:9px;letter-spacing:1px;color:var(--txt-faint);padding:5px 8px;border-bottom:1px solid var(--line);
    text-transform:uppercase;display:flex;justify-content:space-between}
  #mmsvg{display:block;width:100%;height:calc(100% - 22px);cursor:pointer}
  #mmview{fill:rgba(94,227,161,.1);stroke:var(--accent);stroke-width:1.2}

  /* ---------- Legend / breadcrumb ---------- */
  #legend{position:fixed;right:14px;bottom:14px;z-index:40;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;
    max-width:300px}
  #panel.open ~ #legend{right:394px}
  .leg{font-size:10px;color:var(--txt-dim);background:rgba(8,11,16,.8);border:1px solid var(--line);
    padding:5px 9px;border-radius:6px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
  .leg .d{width:7px;height:7px;border-radius:2px}

  /* zoom controls */
  #zoomctl{position:fixed;left:14px;top:60px;z-index:40;display:flex;flex-direction:column;gap:1px;
    background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  #zoomctl button{width:32px;height:30px;background:transparent;border:none;color:var(--txt-dim);
    font-family:var(--mono);font-size:15px;cursor:pointer;border-bottom:1px solid var(--line)}
  #zoomctl button:last-child{border-bottom:none;font-size:10px}
  #zoomctl button:hover{background:var(--panel2);color:#fff}
  #zlabel{position:fixed;left:54px;top:60px;z-index:40;font-size:10px;color:var(--txt-faint);
    background:rgba(8,11,16,.7);padding:3px 7px;border-radius:5px;border:1px solid var(--line)}

  /* run progress bar */
  #runbar{position:fixed;top:46px;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--running),var(--accent));
    z-index:55;transition:width .25s;box-shadow:0 0 8px var(--accent)}

  /* hint */
  #hint{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:35;font-size:11px;color:var(--txt-dim);
    background:rgba(8,11,16,.8);padding:6px 14px;border-radius:20px;border:1px solid var(--line);
    backdrop-filter:blur(4px);transition:opacity .5s;pointer-events:none}
  .kbd{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);font-size:10px;margin:0 2px}
</style>
</head>
<body>

<div id="toolbar">
  <div class="brand"><span class="dot"></span><b>park_yangha</b><span class="path">/ career.dag</span></div>
  <div class="tb-sep"></div>
  <div class="tb-meta">
    <span><span class="k">owner:</span> <span class="v">박양하</span></span>
    <span><span class="k">role:</span> <span class="v">생산운영 PM · 공정기술 · 총괄본부장</span></span>

  <div class="spacer"></div>

</div>
<div id="runbar"></div>

<div id="stage">
  <canvas id="gridbg"></canvas>
  <div id="world">
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div id="zoomctl">
  <button id="zin">+</button>

</div>
<div id="zlabel">100%</div>

<div id="schema"></div>

<div id="minimap">
  <div class="mh"><span>MINIMAP</span><span id="mmstat">overview</span></div>
  <svg id="mmsvg"></svg>
</div>

<div id="legend">
  <span class="leg"><span class="d" style="background:var(--blue)"></span>source</span>
  <span class="leg"><span class="d" style="background:var(--purple)"></span>experience</span>
  <span class="leg"><span class="d" style="background:var(--cyan)"></span>transform</span>
  <span class="leg"><span class="d" style="background:var(--running)"></span>ml</span>
  <span class="leg"><span class="d" style="background:var(--accent)"></span>metric</span>
  <span class="leg"><span class="d" style="background:var(--pink)"></span>sink</span>
</div>

<aside id="panel">
  <div class="ph">
    <div class="ico" id="picon">⬡</div>
    <div>
      <div class="name" id="pname">node</div>
      <div class="meta" id="pmeta"></div>
    </div>
    <div id="pclose">✕</div>
  </div>
  <div id="pbody"></div>
</aside>

<script>
//==================================================================
//  DATA — career as a DAG  (real Korean data, no lorem)
//==================================================================
const NODES = [
  // ---- SOURCES ----
  { id:'src_field', kind:'source', col:0, row:0, type:'extract', icon:'🏭', name:'제조현장 경험',
    sub:'배터리·전자·태양광 제조 라인 운영 현장 데이터', dur:'∞', runs:'src.field.0001',
    desc:'은성에스아이티 → 이랜텍 → 솔라엣지로 이어진 제조 현장. 공정·품질·원가·설비 데이터를 직접 손으로 만지며 축적한 1차 소스. 모든 변환 노드의 입력 신호.',

  { id:'src_data', kind:'source', col:0, row:1, type:'extract', icon:'🗄️', name:'데이터',
    sub:'생산·품질·설비 로그 → DB 적재 및 정제', dur:'streaming', runs:'src.data.0007',
    desc:'현장에서 발생하는 raw 신호를 수집·정제하여 DB로 적재하는 소스. 의사결정의 근거가 되는 정량 데이터 파이프라인의 출발점.',
    kv:[['source type','logs / sensors'],['load','MySQL · RDS'],['mode','batch + stream']],
    tags:['로그','센서','적재','정제'] },
  { id:'src_edu', kind:'source', col:0, row:2, type:'extract', icon:'🎓', name:'교육 / 배경',
    sub:'한국외대 이탈리아어(중퇴) · 호주 4년 · TOEIC 930', dur:'2009–', runs:'src.edu.0003',
    desc:'한국외국어대학교 이탈리아어과 중퇴 후 호주에서 4년 체류. 언어·문화 적응력과 글로벌 커뮤니케이션(TOEIC 930)이라는 비정형 소스를 공급.',
    kv:[['대학','한국외대 이탈리아어 (중퇴)'],['해외','호주 4년'],['어학','TOEIC 930']],
    tags:['이탈리아어','영어','호주','글로벌'] },

  // ---- EXPERIENCE (transform) ----
  { id:'exp_es', kind:'exp', col:1, row:0, type:'transform', icon:'🔋', name:'은성에스아이티',

//==================================================================
//  LAYOUT
//==================================================================
const COLX = [80, 400, 740, 1080, 1380, 1720];   // x per column
const ROWH = 150;                                  // base row height
const NODE_W = 230, NODE_MW = 170;
const nodeById = {};
NODES.forEach(n=>nodeById[n.id]=n);

// vertical centering offsets per column so columns look balanced
function layout(){
  const colRows = {};
  NODES.forEach(n=>{ colRows[n.col]=(colRows[n.col]||0); colRows[n.col]=Math.max(colRows[n.col], n.row+1); });
  const maxRows = Math.max(...Object.values(colRows));
  NODES.forEach(n=>{
    const rows = colRows[n.col];
    const colHeight = rows*ROWH;
    const maxHeight = maxRows*ROWH;
    const offset = (maxHeight-colHeight)/2;
    n.x = COLX[n.col];
    n.y = 40 + offset + n.row*ROWH;
    n.w = n.metric ? NODE_MW : NODE_W;
    n.h = n.ml ? 200 : (n.metric ? 96 : 120);
  });
}
layout();

// world bounds
function worldBounds(){
  let maxX=0,maxY=0;
  NODES.forEach(n=>{ maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h); });
  return {w:maxX+120, h:maxY+120};
}
const WB = worldBounds();

//==================================================================
//  EDGES  (orthogonal-ish bezier) + hit areas + schema tooltips
//==================================================================
const NS='http://www.w3.org/2000/svg';
function edgePath(a,b){
  const x1=a.x+a.w, y1=a.y+a.h/2;
  const x2=b.x, y2=b.y+b.h/2;
  const dx=Math.max(40,(x2-x1)*0.5);
  return `M ${x1},${y1} C ${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
}

// arrow marker + gradient
const defs=document.createElementNS(NS,'defs');
defs.innerHTML=`
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2c3848"/>
  </marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5ee3a1"/>
  </marker>
  <linearGradient id="eg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#243040"/><stop offset="1" stop-color="#2c3a4c"/>
  </linearGradient>`;
edgesSvg.appendChild(defs);

const SCHEMAS = [
  {h:'schema: field_signal',rows:[['process_id','string'],['defect_rate','float'],['cycle_time','float'],['cost_unit','int']]},
  {h:'schema: data_record',rows:[['ts','datetime'],['sensor','float[]'],['lot','string'],['status','enum']]},
  {h:'schema: skill_vector',rows:[['name','string'],['level','int'],['domain','string']]},
  {h:'schema: kpi_delta',rows:[['metric','string'],['before','float'],['after','float'],['delta','%']]},
];

const edgeEls=[];
EDGES.forEach((e,i)=>{
  const a=nodeById[e[0]], b=nodeById[e[1]];
  if(!a||!b) return;
  const d=edgePath(a,b);
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',d); p.setAttribute('fill','none');
  p.setAttribute('stroke','url(#eg)'); p.setAttribute('stroke-width','1.4');
  p.setAttribute('marker-end','url(#arrow)');
  p.setAttribute('opacity','0.85');
  edgesSvg.appendChild(p);

  // hit area for schema hover
  const hit=document.createElementNS(NS,'path');
  hit.setAttribute('d',d); hit.setAttribute('class','ehit');
  const schema = SCHEMAS[i % SCHEMAS.length];
  hit.addEventListener('mousemove',(ev)=>showSchema(ev,schema));
  hit.addEventListener('mouseenter',()=>{ p.setAttribute('stroke','#5ee3a1'); p.setAttribute('stroke-width','2'); p.setAttribute('marker-end','url(#arrowA)'); });
  hit.addEventListener('mouseleave',()=>{ hideSchema(); p.setAttribute('stroke','url(#eg)'); p.setAttribute('stroke-width','1.4'); p.setAttribute('marker-end','url(#arrow)'); });
  edgesSvg.appendChild(hit);

  // moving token (animated data packet)
  const tok=document.createElementNS(NS,'circle');
  tok.setAttribute('r','2.6'); tok.setAttribute('fill','#5ee3a1');
  tok.setAttribute('filter','');
  tok.style.filter='drop-shadow(0 0 4px #5ee3a1)';
  edgesSvg.appendChild(tok);

  edgeEls.push({a:e[0],b:e[1],path:p,len:p.getTotalLength(),tok,phase:Math.random(),speed:0.10+Math.random()*0.13,active:true});
});

//==================================================================
//  TOKEN ANIMATION (60fps)
//==================================================================
let lastT=performance.now();
function animate(t){
  const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  for(const e of edgeEls){
    if(!e.active){ e.tok.style.opacity=0; continue; }
    e.phase += e.speed*dt;
    if(e.phase>1) e.phase-=1;
    const pt=e.path.getPointAtLength(e.phase*e.len);
    e.tok.setAttribute('cx',pt.x); e.tok.setAttribute('cy',pt.y);
    // fade in/out at ends
    const edge = Math.min(e.phase, 1-e.phase);
    e.tok.style.opacity = Math.min(1, edge*8)*0.95;
  }
  drawML(t);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

//==================================================================
//  ML mini live-trained loss curve (delight)
//==================================================================
let mlCanvas=null, mlCtx=null, mlData=[], mlSeed=0;
function initML(){
  mlCanvas=document.getElementById('mlcanvas');
  if(!mlCanvas) return;
  const dpr=window.devicePixelRatio||1;
  mlCanvas.width=206*dpr; mlCanvas.height=54*dpr;
  mlCtx=mlCanvas.getContext('2d'); mlCtx.scale(dpr,dpr);
  // generate a converging loss curve (15% -> ~0)
  mlData=[];
  for(let i=0;i<60;i++){
    const x=i/59;
    const base=0.15*Math.exp(-3.2*x);
    const noise=(Math.sin(i*1.7)+Math.cos(i*0.9))*0.006*(1-x);
    mlData.push(Math.max(0,base+noise));
  }
}
let mlReveal=0;
function drawML(t){
  if(!mlCtx) return;
  const W=206,H=54,pad=4;
  mlCtx.clearRect(0,0,W,H);
  // grid
  mlCtx.strokeStyle='rgba(255,255,255,.04)'; mlCtx.lineWidth=1;
  for(let g=1;g<4;g++){ const y=pad+(H-2*pad)*g/4; mlCtx.beginPath();mlCtx.moveTo(pad,y);mlCtx.lineTo(W-pad,y);mlCtx.stroke(); }
  // reveal animation
  mlReveal=Math.min(mlData.length, mlReveal + 0.4);
  const n=Math.floor(mlReveal);
  const max=0.16;
  // area
  mlCtx.beginPath();
  for(let i=0;i<n;i++){
    const x=pad+(W-2*pad)*i/(mlData.length-1);
    const y=pad+(H-2*pad)*(1-mlData[i]/max);
    i===0?mlCtx.moveTo(x,y):mlCtx.lineTo(x,y);
  }
  if(n>0){
    const lastX=pad+(W-2*pad)*(n-1)/(mlData.length-1);
    mlCtx.lineTo(lastX,H-pad); mlCtx.lineTo(pad,H-pad); mlCtx.closePath();
    const grad=mlCtx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'rgba(240,180,41,.30)'); grad.addColorStop(1,'rgba(240,180,41,0)');
    mlCtx.fillStyle=grad; mlCtx.fill();
  }
  // line
  mlCtx.beginPath();
  for(let i=0;i<n;i++){
    const x=pad+(W-2*pad)*i/(mlData.length-1);
    const y=pad+(H-2*pad)*(1-mlData[i]/max);
    i===0?mlCtx.moveTo(x,y):mlCtx.lineTo(x,y);
  }
  mlCtx.strokeStyle='#f0b429'; mlCtx.lineWidth=1.6; mlCtx.lineJoin='round'; mlCtx.stroke();
  // moving head dot
  if(n>0){
    const i=n-1;
    const x=pad+(W-2*pad)*i/(mlData.length-1);
    const y=pad+(H-2*pad)*(1-mlData[i]/max);
    mlCtx.beginPath(); mlCtx.arc(x,y,2.4,0,7); mlCtx.fillStyle='#5ee3a1'; mlCtx.fill();
  }
  // label
  mlCtx.fillStyle='rgba(201,212,227,.5)'; mlCtx.font='8px monospace';
  mlCtx.fillText('loss · defect_rate', 6, 11);
  mlCtx.fillStyle='#5ee3a1';
  mlCtx.fillText('→ 0.00', W-34, 11);
  if(mlReveal>=mlData.length) mlReveal=mlData.length; // hold
}
initML();

//==================================================================
//  PAN / ZOOM
//==================================================================
const stage=document.getElementById('stage');
const world=document.getElementById('world');
const zlabel=document.getElementById('zlabel');
let scale=1, tx=0, ty=0;
function applyTransform(){
  world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
  zlabel.textContent=Math.round(scale*100)+'%';
  drawGrid(); updateMinimap();
}
function fit(){
  const vw=stage.clientWidth, vh=stage.clientHeight;
  const s=Math.min(vw/(WB.w+60), vh/(WB.h+60), 1.2);
  scale=s;
  tx=(vw - WB.w*s)/2; ty=(vh - WB.h*s)/2;
  applyTransform();
}

let dragging=false, sx,sy, stx,sty, moved=false;
stage.addEventListener('mousedown',e=>{
  if(e.target.closest('.node')||e.target.closest('.ehit')) return;
  dragging=true; moved=false; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty;
  stage.classList.add('grabbing');
});
window.addEventListener('mousemove',e=>{
  if(!dragging) return;
  tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy);
  if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>3) moved=true;
  applyTransform();
});
window.addEventListener('mouseup',()=>{ dragging=false; stage.classList.remove('grabbing'); });

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=stage.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const wx=(mx-tx)/scale, wy=(my-ty)/scale;
  const factor=e.deltaY<0?1.12:0.89;
  scale=Math.min(2.4,Math.max(0.25,scale*factor));
  tx=mx-wx*scale; ty=my-wy*scale;
  applyTransform();
},{passive:false});

document.getElementById('zin').onclick=()=>zoomBtn(1.2);
document.getElementById('zout').onclick=()=>zoomBtn(0.83);
document.getElementById('zfit').onclick=fit;
document.getElementById('zfit').textContent='FIT';
function zoomBtn(f){
  const cx=stage.clientWidth/2, cy=stage.clientHeight/2;
  const wx=(cx-tx)/scale, wy=(cy-ty)/scale;
  scale=Math.min(2.4,Math.max(0.25,scale*f));
  tx=cx-wx*scale; ty=cy-wy*scale; applyTransform();
}
document.getElementById('resetBtn').onclick=fit;

//==================================================================
//  GRID BACKGROUND (canvas, follows transform)
//==================================================================
const grid=document.getElementById('gridbg');
const gctx=grid.getContext('2d');
function sizeGrid(){
  const dpr=window.devicePixelRatio||1;
  grid.width=stage.clientWidth*dpr; grid.height=stage.clientHeight*dpr;
  grid.style.width=stage.clientWidth+'px'; grid.style.height=stage.clientHeight+'px';
  gctx.setTransform(dpr,0,0,dpr,0,0);
  drawGrid();
}
function drawGrid(){
  const w=stage.clientWidth, h=stage.clientHeight;
  gctx.clearRect(0,0,w,h);
  const step=40*scale;
  if(step<6) return;
  const ox=((tx%step)+step)%step, oy=((ty%step)+step)%step;
  gctx.strokeStyle='rgba(255,255,255,.025)'; gctx.lineWidth=1;
  gctx.beginPath();
  for(let x=ox;x<w;x+=step){ gctx.moveTo(x,0); gctx.lineTo(x,h); }
  for(let y=oy;y<h;y+=step){ gctx.moveTo(0,y); gctx.lineTo(w,y); }
  gctx.stroke();
  // major dots
  const mstep=step*5;
  const mox=((tx%mstep)+mstep)%mstep, moy=((ty%mstep)+mstep)%mstep;
  gctx.fillStyle='rgba(94,227,161,.10)';
  for(let x=mox;x<w;x+=mstep) for(let y=moy;y<h;y+=mstep){
    gctx.beginPath(); gctx.arc(x,y,1.3,0,7); gctx.fill();
  }
}

//==================================================================
//  MINIMAP
//==================================================================
const mmsvg=document.getElementById('mmsvg');
function buildMinimap(){
  mmsvg.innerHTML='';
  const bbox=mmsvg.getBoundingClientRect();
  const mw=bbox.width||200, mh=bbox.height||108;
  const s=Math.min(mw/WB.w, mh/WB.h)*0.92;
  const offx=(mw-WB.w*s)/2, offy=(mh-WB.h*s)/2;
  mmsvg._s=s; mmsvg._ox=offx; mmsvg._oy=offy;
  // edges
  EDGES.forEach(e=>{
    const a=nodeById[e[0]],b=nodeById[e[1]]; if(!a||!b)return;
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',offx+(a.x+a.w)*s); l.setAttribute('y1',offy+(a.y+a.h/2)*s);
    l.setAttribute('x2',offx+b.x*s); l.setAttribute('y2',offy+(b.y+b.h/2)*s);
    l.setAttribute('stroke','#2a3543'); l.setAttribute('stroke-width','0.6');
    mmsvg.appendChild(l);
  });
  const COLOR={source:'#4aa8ff',exp:'#b08cff',skill:'#36d9d9',metric:'#5ee3a1',sink:'#ff7eb6',ml:'#f0b429'};
  NODES.forEach(n=>{
    const r=document.createElementNS(NS,'rect');
    r.setAttribute('x',offx+n.x*s); r.setAttribute('y',offy+n.y*s);
    r.setAttribute('width',Math.max(3,n.w*s)); r.setAttribute('height',Math.max(2,n.h*s));
    r.setAttribute('rx','1.5'); r.setAttribute('fill',COLOR[n.kind]||'#888'); r.setAttribute('opacity','.85');
    r.dataset.id=n.id;
    mmsvg.appendChild(r);
  });
  const view=document.createElementNS(NS,'rect');
  view.setAttribute('id','mmview'); view.setAttribute('rx','2');
  mmsvg.appendChild(view);
}
function updateMinimap(){
  const view=document.getElementById('mmview'); if(!view)return;
  const s=mmsvg._s, offx=mmsvg._ox, offy=mmsvg._oy;
  // visible world rect
  const vx=-tx/scale, vy=-ty/scale, vw=stage.clientWidth/scale, vh=stage.clientHeight/scale;
  view.setAttribute('x',offx+vx*s); view.setAttribute('y',offy+vy*s);
  view.setAttribute('width',vw*s); view.setAttribute('height',vh*s);
}
mmsvg.addEventListener('click',e=>{
  const rect=mmsvg.getBoundingClientRect();
  const s=mmsvg._s,offx=mmsvg._ox,offy=mmsvg._oy;
  const wx=((e.clientX-rect.left)-offx)/s, wy=((e.clientY-rect.top)-offy)/s;
  tx=stage.clientWidth/2 - wx*scale; ty=stage.clientHeight/2 - wy*scale;
  applyTransform();
});

        if(kv[0]==='github') v=`<a href="https://${v}" target="_blank" style="color:var(--accent)">${v}</a>`;
        if(kv[0]==='tel') v=`<a href="tel:01074481791" style="color:var(--accent)">${v}</a>`;
      }
      html+=`<div class="kv"><span class="k">${kv[0]}</span><span class="v">${v}</span></div>`;
    });
    html+=`</div>`;
  }
  if(n.ach){
    html+=`<div class="sec"><h4>output metrics</h4>`;
    n.ach.forEach(a=>{ html+=`<div class="ach"><span class="n">${a[0]}</span><span class="t">${a[1]}</span></div>`; });
    html+=`</div>`;
  }
  if(n.tags){
    html+=`<div class="sec"><h4>tags</h4><div class="tags">`+
      n.tags.map(t=>`<span class="tag ${n.kind==='skill'?'hl':''}">${t}</span>`).join('')+`</div></div>`;
  }
  // upstream / downstream
  const up=EDGES.filter(e=>e[1]===id).map(e=>nodeById[e[0]]?.name).filter(Boolean);
  const down=EDGES.filter(e=>e[0]===id).map(e=>nodeById[e[1]]?.name).filter(Boolean);

  html+=`<div class="kv"><span class="k">downstream ↓</span><span class="v">${down.length?down.join(', '):'— (terminal sink)'}</span></div>`;

function closePanel(){ panel.classList.remove('open'); if(selId){nodeById[selId].el.classList.remove('sel');selId=null;} }
document.getElementById('pclose').onclick=closePanel;
stage.addEventListener('click',e=>{ if(!moved && !e.target.closest('.node')) closePanel(); });

//==================================================================
//  RUN PIPELINE — topological execution sweep
//==================================================================
function topoOrder(){
  const indeg={}, adj={};
  NODES.forEach(n=>{indeg[n.id]=0;adj[n.id]=[];});
  EDGES.forEach(e=>{ if(adj[e[0]]&&indeg[e[1]]!=null){adj[e[0]].push(e[1]);indeg[e[1]]++;} });
  const q=NODES.filter(n=>indeg[n.id]===0).map(n=>n.id);
  const order=[];
  while(q.length){
    const id=q.shift(); order.push(id);
    (adj[id]||[]).forEach(t=>{ if(--indeg[t]===0) q.push(t); });
  }
  return order;
}
let running=false;
const runBtn=document.getElementById('runBtn');
const runbar=document.getElementById('runbar');
runBtn.onclick=runPipeline;
async function runPipeline(){
  if(running) return;
  running=true;
  runBtn.classList.add('running');
  runBtn.innerHTML='<span class="tri">■</span> RUNNING…';
  // reset
  NODES.forEach(n=>{ n.status='queued'; n.el.dataset.status='queued'; updatePill(n); });
  edgeEls.forEach(e=>{ e.active=false; });
  const order=topoOrder();
  const total=order.length;
  for(let i=0;i<order.length;i++){
    const n=nodeById[order[i]];
    n.status='running'; n.el.dataset.status='running'; updatePill(n);
    // activate incoming edges
    edgeEls.forEach(e=>{ if(e.b===n.id){ e.active=true; e.phase=0; e.speed=0.9; } });
    runbar.style.width=((i+0.5)/total*100)+'%';
    // briefly flash the node by centering minimap node highlight
    await sleep(n.metric?170:300);
    n.status='success'; n.el.dataset.status='success'; updatePill(n);
    edgeEls.forEach(e=>{ if(e.b===n.id){ e.speed=0.12+Math.random()*0.1; } });
  }
  runbar.style.width='100%';
  await sleep(400);
  runbar.style.width='0%';
  edgeEls.forEach(e=>{ e.active=true; });
  runBtn.classList.remove('running');
  runBtn.innerHTML='<span class="tri">✓</span> RUN AGAIN';
  running=false;
}
function updatePill(n){
  if(n.metric) return;
  const pill=n.el.querySelector('.pill');
  if(!pill) return;
  const map={success:['success','SUCCESS'],running:['running','RUNNING'],queued:['queued','QUEUED'],idle:['idle','IDLE']};
  const [c,t]=map[n.status]||map.idle;
  pill.className='pill '+c;
  pill.innerHTML='<span class="d"></span>'+t;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

//  INIT
//==================================================================
function boot(){
  sizeGrid();
  buildMinimap();
  fit();
  // entrance: nudge run-mi to running pill state already (present day)
  const mi=nodeById['exp_mi']; mi.status='running'; mi.el.dataset.status='running'; updatePill(mi);
  // auto-hide hint
  setTimeout(()=>{const h=document.getElementById('hint'); if(h) h.style.opacity='0';},6500);
}

// await fonts for headless PDF correctness, then boot
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(boot);
} else { boot(); }
// fallback boot in case fonts.ready never resolves in headless
setTimeout(()=>{ if(!mmsvg._s) boot(); }, 300);
