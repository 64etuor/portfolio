<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS-BIOS // POWER-ON SELF-TEST</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root{
    --phos:#d7d7d7;
    --phos-dim:#8d8d8d;
    --phos-deep:#3a3a3a;
    --accent:#c8c8c8;
    --bg:#050505;
    --bg2:#101010;
    --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  }
  @font-face{
    font-family:'JetBrains Mono';
    font-display:swap;
    src:url('https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.woff2') format('woff2');
    font-weight:400;
  }
  @font-face{
    font-family:'JetBrains Mono';
    font-display:swap;
    src:url('https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-700-normal.woff2') format('woff2');
    font-weight:700;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--phos);
    font-family:var(--mono);
    font-size:15px;
    line-height:1.55;
    overflow:hidden;
    word-break:keep-all;
    -webkit-font-smoothing:none;
  }
  .kr{font-family:'Pretendard',var(--mono);}

  /* ===== CRT shell ===== */
  #crt{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 130% 130% at 50% 50%, var(--bg2) 0%, var(--bg) 62%, #000 100%);
    overflow:hidden;
  }
  #crt::before{
    /* scanlines */
    content:"";position:absolute;inset:0;z-index:50;pointer-events:none;
    background:repeating-linear-gradient(0deg,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.14) 3px,
      rgba(0,0,0,0.14) 4px);
    mix-blend-mode:multiply;
  }
  #crt::after{
    /* quiet vignette */
    content:"";position:absolute;inset:0;z-index:51;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(0,0,0,.72) 100%);
    opacity:.86;
  }

  /* power-on flash — the tube warming up */
  #flash{
    position:absolute;inset:0;z-index:55;pointer-events:none;background:#fff;
    opacity:0;
  }
  #flash.poweron{animation:poweron 1.05s ease-out forwards}
  @keyframes poweron{
    0%{opacity:0;transform:scaleY(.004);filter:brightness(3)}
    6%{opacity:.9;transform:scaleY(.012)}
    14%{opacity:.5;transform:scaleY(.5)}
    30%{opacity:.12;transform:scaleY(1)}
    100%{opacity:0;transform:scaleY(1)}
  }
  #flash.ready{animation:readyflash .5s ease-out forwards}
  @keyframes readyflash{0%{opacity:.42}100%{opacity:0}}

  #screen{
    position:absolute;inset:0;
    padding:34px 48px 70px;
    overflow:hidden;
    text-shadow:0 0 3px rgba(255,255,255,.18);
    z-index:10;
    opacity:0;
  }
  #screen.lit{animation:screenin .9s ease-out .18s forwards}
  @keyframes screenin{from{opacity:0}to{opacity:1}}

  /* ===== BOOT layer ===== */
  #boot{height:100%;display:flex;flex-direction:column;}
  .banner{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:1px solid var(--phos-deep);padding-bottom:10px;margin-bottom:14px;
  }
  .banner .vend{font-weight:700;letter-spacing:.5px;}
  .banner .vend b{color:var(--accent);text-shadow:none}
  .banner .meta{text-align:right;color:var(--phos-dim);font-size:12.5px;}

  /* ASCII logo */
  #asciiLogo{color:var(--phos);font-size:11px;line-height:1.05;white-space:pre;
    margin:2px 0 10px;text-shadow:none;min-height:0}

  .bootlog{flex:1;overflow:hidden;font-size:14px;}
  .bootlog .line{white-space:pre-wrap;}
  .ok{color:var(--phos);}
  .dim{color:var(--phos-dim);}
  .tag-ok{color:#000;background:var(--phos);padding:0 5px;font-weight:700;border-radius:1px;}

  .membar{color:var(--phos-dim);}
  .membar .fill{color:var(--phos)}

  /* final READY banner — the handoff frame */
  .readyline{
    margin-top:10px;font-weight:700;letter-spacing:2px;color:var(--phos);
    opacity:0;
  }
  .readyline.on{animation:rfade .4s ease forwards}
  @keyframes rfade{from{opacity:0}to{opacity:1}}

  .bootfoot{
    position:absolute;left:48px;right:48px;bottom:26px;
    display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--phos-deep);padding-top:10px;font-size:12.5px;color:var(--phos-dim);
  }
  .bootfoot .stat{letter-spacing:1px}
  .prog{flex:1;margin:0 24px;height:9px;border:1px solid var(--phos-deep);position:relative;}
  .prog > i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--phos);
    box-shadow:none;transition:width .15s linear;display:block}

  .cur{display:inline-block;width:9px;height:15px;background:var(--phos);
    vertical-align:-2px;margin-left:6px;animation:blink 1.05s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  @media (max-width:980px){
    #screen{padding:24px 22px 60px}
    .bootfoot{left:22px;right:22px}
  }
</style>
</head>
<body>
<div id="crt">
  <div id="flash"></div>
  <div id="screen">

    <!-- ============ BOOT ============ -->
    <div id="boot">
      <div class="banner">
        <div>
          <div class="vend"><b>SYS</b>-BIOS &nbsp; Core Microsystems</div>
          <div class="dim">Firmware Rev. 04.18 &nbsp;|&nbsp; HumanCore&trade; x1 @ 3.6GHz &nbsp;|&nbsp; (C) 2025</div>
        </div>
        <div class="meta">
          POWER-ON SELF-TEST<br>SERIAL 0xENG-OPS-SYS
        </div>
      </div>

      <pre id="asciiLogo"></pre>

      <div class="bootlog" id="bootlog"></div>

      <div class="readyline" id="readyline">SYSTEM READY<span class="cur"></span></div>

      <div class="bootfoot">
        <span class="stat" id="bootstat">POST</span>
        <div class="prog"><i id="progbar"></i></div>
        <span id="progpct">00%</span>
      </div>
    </div>

  </div>
</div>

<script>
/* ============ TIMING ============ */
const BOOT_MS = 6200; // ideal on-screen duration (declared to parent film)
try{
  parent && parent !== window &&
  parent.postMessage({type:'film-scene', file:'05-bios-boot.html', ms:BOOT_MS, ready:true}, '*');
}catch(e){}

/* POST checklist — clean, generic firmware boot lines (no narrative content) */
const POST = [
  {t:'Initializing SYS-BIOS Power-On Self-Test ...', s:'dim'},
  {t:'CMOS Checksum ................. valid', s:'dim'},
  {t:'Detecting HumanCore™ Processor . online', s:'ok'},
  {mem:true},
  {t:'PCI Bus enumeration .......... 7 devices', s:'ok', tag:1},
  {t:'Storage controller ........... attached', s:'ok', tag:1},
  {t:'System clock ................. synchronized', s:'ok', tag:1},
  {t:'Display adapter .............. CRT 1280x720', s:'ok', tag:1},
  {t:'Loading firmware modules ..... mounted', s:'ok', tag:1},
  {t:'Verifying boot signature ..... v04.18', s:'ok', tag:1},
  {t:'Handing off to system shell .. ready', s:'ok'},
];

const LOGO = [
" ____   _   _ _   _ ",
"|  _ \\ | | | | | | |   S Y S T E M",
"| |_) || | | | |_| |   F I R M W A R E",
"|  __/ | |_| |  _  |   v04.18  ONLINE",
"|_|     \\___/|_| |_|   SYS-BIOS  CORE",
];

/* ============ ELEMENTS ============ */
const $ = s=>document.querySelector(s);
const screenEl=$('#screen'), flashEl=$('#flash');
const logEl=$('#bootlog'), logoEl=$('#asciiLogo');
const barEl=$('#progbar'), pctEl=$('#progpct'), statEl=$('#bootstat'), readyEl=$('#readyline');
let done=false, timers=[];

/* ============ HELPERS ============ */
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setProg(p){
  p=Math.min(100,Math.round(p));
  barEl.style.width=p+'%';
  pctEl.textContent=String(p).padStart(2,'0')+'%';
}

/* ============ ASCII LOGO type-in ============ */
function typeLogo(cb){
  let i=0;
  (function step(){
    if(done)return;
    logoEl.textContent = LOGO.slice(0,i+1).join('\n');
    i++;
    if(i<LOGO.length){ timers.push(setTimeout(step,60)); }
    else { timers.push(setTimeout(cb,150)); }
  })();
}

/* ============ MEMORY COUNT-UP ============ */
function memCount(lineEl, cb){
  const TARGET=2048; let v=0;
  const step=()=>{
    if(done)return;
    v += Math.max(1, Math.round((TARGET-v)/5));
    if(v>=TARGET)v=TARGET;
    lineEl.innerHTML='<span class="membar">Memory Test : <span class="fill">'
      + String(v).padStart(4,' ')+'</span> MB OK</span>';
    if(v<TARGET){ timers.push(setTimeout(step, 22)); }
    else { timers.push(setTimeout(cb,200)); }
  };
  step();
}

/* ============ BOOT SEQUENCE ============ */
function runBoot(){
  typeLogo(()=>{
    let idx=0;
    const total=POST.length;
    const next=()=>{
      if(done)return;
      if(idx>=total){ setProg(100); timers.push(setTimeout(finishBoot,360)); return; }
      const item=POST[idx];
      setProg(6 + (idx/total)*94);

      if(item.mem){
        const ln=document.createElement('div'); ln.className='line';
        logEl.appendChild(ln);
        memCount(ln, ()=>{ idx++; next(); });
        return;
      }
      const ln=document.createElement('div');
      ln.className='line '+(item.s||'dim');
      let html=esc(item.t);
      if(item.tag) html+=' <span class="tag-ok">[ OK ]</span>';
      ln.innerHTML=html;
      logEl.appendChild(ln);
      idx++;
      timers.push(setTimeout(next, 185));
    };
    next();
  });
}

/* ============ READY / HANDOFF ============ */
function finishBoot(){
  if(done)return;
  done=true;
  setProg(100);
  statEl.textContent='READY';
  readyEl.classList.add('on');
  flashEl.classList.remove('poweron');
  // brief warm flash as the system "comes up" — earns the cut to the film
  void flashEl.offsetWidth;
  flashEl.classList.add('ready');
}

/* ============ STATIC READY FRAME (reduced motion) ============ */
function showReadyStatic(){
  done=true;
  screenEl.style.opacity='1';
  logoEl.textContent=LOGO.join('\n');
  logEl.innerHTML='';
  POST.forEach(item=>{
    const ln=document.createElement('div');
    if(item.mem){ ln.className='line';
      ln.innerHTML='<span class="membar">Memory Test : <span class="fill">2048</span> MB OK</span>'; }
    else{ ln.className='line '+(item.s||'dim');
      let html=esc(item.t);
      if(item.tag) html+=' <span class="tag-ok">[ OK ]</span>';
      ln.innerHTML=html; }
    logEl.appendChild(ln);
  });
  setProg(100);
  statEl.textContent='READY';
  readyEl.style.opacity='1';
}

/* ============ START ============ */
function startAnim(){
  flashEl.classList.add('poweron');
  screenEl.classList.add('lit');
  timers.push(setTimeout(runBoot, 280));
}
function start(){
  const reduce = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ showReadyStatic(); return; }
  startAnim();
}

/* fonts ready, with safe fallback so headless never stalls */
if(document.fonts && document.fonts.ready){
  let started=false;
  const go=()=>{ if(!started){ started=true; start(); } };
  document.fonts.ready.then(go);
  setTimeout(go, 500);
} else { start(); }
</script>
</body>
</html>
