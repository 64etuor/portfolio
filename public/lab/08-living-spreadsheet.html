<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>박양하 · 살아있는 스프레드시트 — 코딩의 기원</title>
<style>
/* ───────────────────────── tokens ───────────────────────── */
:root{
  --app-bg:#0a0c10;
  --chrome:#1e6b3f;
  --chrome-2:#155230;
  --chrome-3:#0d3620;
  --ribbon:#141820;
  --ribbon-line:#252c38;
  --paper:#0d1117;
  --grid:#1e2736;
  --grid-strong:#2a3548;
  --hdr:#111620;
  --hdr-line:#1e2736;
  --hdr-ink:#7a8fa8;
  --ink:#c9d4e0;
  --ink-2:#8999ad;
  --ink-3:#4f6070;
  --sel:#1e6b3f;
  --sel-fill:rgba(30,107,63,.14);
  --sel-band:rgba(30,107,63,.08);
  --precedent:#3b82f6;
  --precedent-fill:rgba(59,130,246,.12);
  --formula:#4ade80;
  --num:#60a5fa;
  --good:#34d399;
  --bad:#f87171;
  --warn:#fbbf24;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Pretendard","Apple SD Gothic Neo","Helvetica Neue",-apple-system,system-ui,sans-serif;
  --rowh:30px;
  --hdrh:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1400px 800px at 50% -8%, rgba(30,107,63,.12), transparent 60%),
    var(--app-bg);
  color:var(--ink);
  font-family:var(--sans);
  word-break:keep-all;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  font-size:13px;
}
::selection{background:rgba(30,107,63,.3)}

/* ───────────────────────── window shell ───────────────────────── */
.app{
  position:fixed;inset:14px;border-radius:9px;overflow:hidden;
  display:grid;grid-template-rows:auto auto auto 1fr auto auto;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.06);
  background:var(--paper);
  min-width:980px;
}

/* title bar */
.titlebar{
  background:linear-gradient(180deg,var(--chrome),var(--chrome-2));
  color:#d4f5e4;height:42px;display:flex;align-items:center;gap:12px;
  padding:0 14px;font-weight:600;letter-spacing:-.01em;
  border-bottom:1px solid var(--chrome-3);
}
.traffic{display:flex;gap:8px;margin-right:6px}
.traffic i{width:12px;height:12px;border-radius:50%;display:block}
.traffic .r{background:#ff5f57}.traffic .y{background:#febc2e}.traffic .g{background:#28c840}
.titlebar .logo{
  width:24px;height:24px;border-radius:5px;background:rgba(255,255,255,.12);color:#d4f5e4;
  display:grid;place-items:center;font-weight:800;font-size:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.4);
}
.titlebar .doc{font-size:13.5px}
.titlebar .doc small{opacity:.75;font-weight:400;margin-left:8px}
.titlebar .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:400;font-size:12px;opacity:.88}
.titlebar .who b{font-weight:700}
.titlebar .avatar{
  width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15);color:#d4f5e4;
  display:grid;place-items:center;font-weight:800;font-size:12px;
}

/* ribbon / toolbar */
.ribbon{
  background:var(--ribbon);border-bottom:1px solid var(--ribbon-line);
  display:flex;align-items:center;gap:6px;padding:5px 10px;flex-wrap:wrap;
  font-size:12px;color:var(--ink-2);
}
.rib-grp{display:flex;align-items:center;gap:4px;padding:0 8px;border-right:1px solid var(--ribbon-line)}
.rib-grp:last-child{border-right:none}
.rbtn{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;
  background:transparent;border:1px solid transparent;color:var(--ink);cursor:pointer;
  font-family:var(--sans);font-size:12px;line-height:1;transition:.12s;white-space:nowrap;
}
.rbtn:hover{background:#1a2030;border-color:var(--ribbon-line)}
.rbtn.on{background:var(--chrome);color:#d4f5e4;border-color:var(--chrome-2)}
.rbtn .ic{font-family:var(--mono);font-weight:700;font-size:12px}
.rib-status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink-3);font-family:var(--mono);font-size:11px}
.recalc-led{width:8px;height:8px;border-radius:50%;background:#2a3548;transition:.2s}
.recalc-led.busy{background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.18)}
.recalc-led.done{background:var(--good);box-shadow:0 0 0 3px rgba(52,211,153,.18)}

/* formula bar */
.fxbar{
  display:flex;align-items:stretch;background:var(--paper);border-bottom:1px solid var(--hdr-line);
  height:30px;font-family:var(--mono);font-size:12.5px;
}
.namebox{
  width:120px;border-right:1px solid var(--hdr-line);display:flex;align-items:center;
  justify-content:space-between;padding:0 10px;color:var(--ink);font-weight:700;
  background:#0d1420;
}
.namebox .caret{color:var(--ink-3);font-size:9px}
.fx-icon{
  width:46px;display:grid;place-items:center;border-right:1px solid var(--hdr-line);
  color:var(--ink-3);font-style:italic;font-weight:700;
}
.fx-input{
  flex:1;display:flex;align-items:center;padding:0 12px;color:var(--ink);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.fx-input .kw{color:var(--formula);font-weight:700}
.fx-input .ref{color:var(--num);font-weight:700}
.fx-input .str{color:#f472b6}
.fx-input .cmt{color:var(--ink-3)}

/* ───────────────────────── grid ───────────────────────── */
.gridwrap{position:relative;overflow:auto;background:var(--paper);min-height:0;align-self:stretch}
.sheetpane{display:none}
.sheetpane.active{display:block}

table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12.5px;width:max-content}
table.sheet col.rowhdr{width:42px}
.sheet th,.sheet td{
  border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
  height:var(--rowh);padding:0 9px;text-align:left;vertical-align:middle;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;
}
/* column header row */
.sheet thead th{
  position:sticky;top:0;z-index:6;height:var(--hdrh);
  background:var(--hdr);color:var(--hdr-ink);font-weight:600;text-align:center;
  border-bottom:1px solid var(--hdr-line);font-family:var(--mono);font-size:11px;
  user-select:none;
}
/* corner */
.sheet thead th.corner{
  position:sticky;left:0;top:0;z-index:8;background:var(--hdr);
  border-right:1px solid var(--hdr-line);
}
.sheet thead th.corner::after{
  content:"";position:absolute;right:3px;bottom:3px;width:0;height:0;
  border-style:solid;border-width:0 0 8px 8px;border-color:transparent transparent var(--ink-3) transparent;
}
/* row headers */
.sheet td.rowhdr,.sheet th.rowhdr{
  position:sticky;left:0;z-index:5;background:var(--hdr);color:var(--hdr-ink);
  text-align:center;font-family:var(--mono);font-size:11px;font-weight:600;
  border-right:1px solid var(--hdr-line);user-select:none;
}
/* freeze header row */
tr.freeze th, tr.freeze td{
  position:sticky;z-index:4;background:#101826;font-weight:700;color:var(--ink);
  border-bottom:1px solid var(--grid-strong);
}
tr.freeze td.rowhdr{z-index:7}

.sheet td.num{font-family:var(--mono);text-align:right;color:var(--num)}
.sheet td.formula{font-family:var(--mono);color:var(--formula)}
.sheet td.zebra{background:#0f1520}
.sheet td.title{font-weight:700;color:var(--ink)}
.sheet td.muted{color:var(--ink-2)}
.sheet td.wide{max-width:340px;white-space:normal;line-height:1.45;padding-top:5px;padding-bottom:5px;height:auto;word-break:keep-all}

/* highlight states */
.sheet td.hl-active{
  outline:2px solid var(--sel);outline-offset:-2px;z-index:3;
  background:var(--sel-fill);box-shadow:inset 0 0 0 1px rgba(30,107,63,.5);
}
.sheet td.hl-active .fillhandle{
  position:absolute;right:-3px;bottom:-3px;width:7px;height:7px;background:var(--sel);
  border:1px solid #0d1117;cursor:crosshair;z-index:4;
}
.sheet td.hl-precedent{
  outline:1.5px dashed var(--precedent);outline-offset:-2px;
  background:var(--precedent-fill) !important;animation:antsglow .9s ease;
}
.sheet td.col-band{background:var(--sel-band)}
.sheet td.row-band{background:var(--sel-band)}
@keyframes antsglow{from{box-shadow:inset 0 0 0 30px rgba(59,130,246,.20)}to{box-shadow:inset 0 0 0 0 rgba(59,130,246,0)}}

/* recalc sweep flash */
.sheet td.recalcing{animation:recalcflash .5s ease}
@keyframes recalcflash{
  0%{background:rgba(251,191,36,.28)}
  60%{background:rgba(52,211,153,.15)}
  100%{background:transparent}
}
.sheet td.justset{color:var(--good) !important}

/* conditional-format heatmap cells */
.heat{font-family:var(--mono);text-align:right;font-weight:700;color:var(--ink);position:relative}
.databar{position:absolute;left:0;top:3px;bottom:3px;border-radius:2px;opacity:.85;z-index:0}
.heat .v{position:relative;z-index:1}

/* metric arrow */
.arrow-up{color:var(--good)} .arrow-dn{color:var(--bad)}

/* ───────────────────────── pivot / chart panel ───────────────────────── */
.metricwrap{display:grid;grid-template-columns:minmax(520px,1fr) minmax(360px,420px);gap:0;height:100%}
.metricwrap .gridcol{overflow:auto;border-right:1px solid var(--hdr-line)}
.pivot{padding:14px 16px;overflow:auto;background:#0c1018}
.pivot h4{font-size:12px;color:var(--hdr-ink);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;font-family:var(--mono)}
.pivot .pv-sub{color:var(--ink-3);font-size:11px;margin-bottom:12px;font-family:var(--mono)}
#chart{width:100%;height:280px}
.pivot .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11px;color:var(--ink-2)}
.pivot .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pivot .pv-note{margin-top:14px;padding:10px 12px;border:1px solid var(--ribbon-line);border-radius:7px;background:#111820;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.pivot .pv-note b{color:var(--good)}

/* image placeholder */
.img-placeholder{
  margin-top:12px;border:1px dashed var(--ribbon-line);border-radius:8px;
  background:#0e1520;padding:18px 14px;text-align:center;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.img-placeholder .ph-icon{font-size:22px;opacity:.4}
.img-placeholder .ph-label{color:var(--ink-3);letter-spacing:.04em}

/* Excel->Code toggle banner */
.dax{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border:1px dashed var(--chrome);border-radius:8px;background:rgba(30,107,63,.06)}
.dax .lab{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.toggle{position:relative;width:138px;height:26px;border-radius:14px;background:#141c28;cursor:pointer;border:1px solid var(--ribbon-line);flex:none}
.toggle .knob{position:absolute;top:2px;left:2px;width:64px;height:20px;border-radius:11px;background:var(--chrome);color:#d4f5e4;display:grid;place-items:center;font-size:10px;font-weight:700;transition:.28s cubic-bezier(.4,1.3,.5,1)}
.toggle.after .knob{left:72px;background:#1d4ed8}
.toggle .ghost{position:absolute;top:0;height:100%;display:grid;place-items:center;font-size:10px;color:var(--ink-3);width:64px}
.toggle .ghost.l{left:4px}.toggle .ghost.r{right:4px}

/* ───────────────────────── sheet tabs + status bar ───────────────────────── */
.tabbar{
  display:flex;align-items:stretch;background:var(--ribbon);border-top:1px solid var(--ribbon-line);
  height:30px;padding-left:8px;
}
.tabscroll{display:flex;align-items:center;color:var(--ink-3);padding:0 8px;font-family:var(--mono);font-size:11px;gap:6px}
.tabs{display:flex;align-items:stretch}
.tab{
  display:flex;align-items:center;gap:7px;padding:0 16px;font-size:12.5px;color:var(--ink-2);
  cursor:pointer;border-right:1px solid var(--ribbon-line);background:transparent;position:relative;
  border:none;border-right:1px solid var(--ribbon-line);font-family:var(--sans);transition:.12s;
}
.tab .dot{width:9px;height:9px;border-radius:2px}
.tab:hover{background:#141c28;color:var(--ink)}
.tab.active{
  background:var(--paper);color:var(--ink);font-weight:700;
  box-shadow:inset 0 2.5px 0 var(--chrome);border-bottom:1px solid var(--paper);margin-bottom:-1px;
}
.tab .cnt{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.addtab{display:grid;place-items:center;width:34px;color:var(--ink-3);cursor:default}

.statusbar{
  display:flex;align-items:center;gap:0;background:linear-gradient(180deg,var(--chrome),var(--chrome-2));
  color:#d4f5e4;height:24px;font-size:11px;font-family:var(--mono);
}
.statusbar .sb{padding:0 14px;border-right:1px solid rgba(255,255,255,.12);height:100%;display:flex;align-items:center;gap:7px}
.statusbar .sb.right{margin-left:auto;border-right:none;border-left:1px solid rgba(255,255,255,.12)}
.statusbar b{color:#fff;font-weight:700}
.statusbar .zoom{display:flex;align-items:center;gap:8px}
.statusbar .ready{color:#86efac}

/* tooltip */
.celltip{
  position:fixed;z-index:50;pointer-events:none;max-width:300px;
  background:#0d1520;color:#c9d4e0;font-family:var(--mono);font-size:11px;line-height:1.5;
  padding:8px 11px;border-radius:7px;box-shadow:0 10px 30px -8px rgba(0,0,0,.7);
  opacity:0;transform:translateY(4px);transition:.12s;border:1px solid rgba(255,255,255,.08);
}
.celltip.show{opacity:1;transform:translateY(0)}
.celltip .tk{color:#4ade80;font-weight:700}
.celltip .tr{color:#60a5fa}

/* responsive guard */
@media (max-width:1180px){
  .metricwrap{grid-template-columns:1fr}
  .pivot{border-top:1px solid var(--hdr-line)}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- title bar -->
  <div class="titlebar">
    <span class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></span>
    <span class="logo">박</span>
    <span class="doc">코딩의_기원_박양하.xlsx <small>— 엑셀 자동화에서 개발자로</small></span>
    <span class="who">
      마지막 재계산 <b id="lastcalc">--</b>
      <span class="avatar">YH</span>
    </span>
  </div>

  <!-- ribbon -->
  <div class="ribbon">
    <div class="rib-grp">
      <button class="rbtn" id="btnRecalc"><span class="ic">sum</span> 전체 재계산 <small style="color:var(--ink-3)">F9</small></button>
    </div>
    <div class="rib-grp">
      <button class="rbtn on" id="btnTrace"><span class="ic">-&gt;</span> 수식 추적</button>
      <button class="rbtn on" id="btnHeat"><span class="ic">##</span> 조건부 서식</button>
    </div>
    <div class="rib-grp">
      <span style="color:var(--ink-3);font-family:var(--mono);font-size:11px">=SUM · =IF · =VLOOKUP · =MACRO · =SQL · =CODE()</span>
    </div>
    <div class="rib-status">
      <span class="recalc-led" id="led"></span>
      <span id="recalcMsg">계산 준비</span>
    </div>
  </div>

  <!-- formula bar -->
  <div class="fxbar">
    <div class="namebox"><span id="nameRef">A1</span><span class="caret">v</span></div>
    <div class="fx-icon">fx</div>
    <div class="fx-input" id="fxInput"></div>
  </div>

  <!-- grid -->
  <div class="gridwrap" id="gridwrap"></div>

  <!-- sheet tabs -->
  <div class="tabbar">
    <div class="tabscroll">&lt; &gt;</div>
    <div class="tabs" id="tabs"></div>
    <div class="addtab">+</div>
  </div>

  <!-- status bar -->
  <div class="statusbar">
    <span class="sb ready" id="sbReady">준비</span>
    <span class="sb" id="sbCell">셀 A1</span>
    <span class="sb" id="sbAgg">합계: --</span>
    <span class="sb right zoom">박양하 · 현장의 불합리를 코드로 바꿈 &nbsp; 100%</span>
  </div>
</div>

<div class="celltip" id="celltip"></div>

<script type="module">
import * as echarts from "https://esm.sh/echarts@5.5.0?bundle";

/* ─────────────────────────────────────────────────────────────────────
   DATA MODEL  -- 코딩의 기원 (엑셀 -> 코드 전환 서사)
   ───────────────────────────────────────────────────────────────────── */

// 전환 단계: 수기 -> 엑셀 -> VBA/매크로 -> SQL/DB -> 코드
const JOURNEY = [
  {phase:"수기 반복",  period:"현장 초기",  tool:"종이·수기 집계",
   trigger:"같은 숫자를 하루 수십 번 옮겨 적다가 - 왜 이걸 사람이 해야 하지?",

// 관성 거부 원칙 데이터

  {k:"전환 트리거", v:"엑셀 한계 인식 -> 구조 설계 전환",       note:"엑셀->DB->코드 순서로 의심"},

];

// 도구 진화 히스토리
const TOOLS = [
  {era:"0단계", name:"수기/종이",      kind:"아날로그", power:5,  unlock:"패턴 인식"},
  {era:"1단계", name:"Excel 함수",    kind:"자동화 기초", power:30, unlock:"시간 단축 체감"},
  {era:"2단계", name:"VBA 매크로",    kind:"반복 자동화", power:55, unlock:"구조적 한계 직면"},
  {era:"3단계", name:"SQL/DB 설계",   kind:"데이터 구조화", power:78, unlock:"분산 데이터 통합"},

  {era:"5단계", name:"React/DevOps", kind:"풀스택/인프라", power:95, unlock:"아이디어 -> 제품 직접 구현"},
];

const CAT_COLOR = {
  "아날로그":"#4f6070",

/* helpers ----------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const COLNAME = n => { let s=""; n++; while(n>0){ s=String.fromCharCode(65+(n-1)%26)+s; n=Math.floor((n-1)/26);} return s; };

const CELLS = {};
function regCell(el, ref, opts={}){
  el.dataset.ref = ref;
  CELLS[ref] = {ref, el, ...opts};
  return el;
}

   SHEET BUILDERS

function tableShell(cols){
  const t = document.createElement("table"); t.className="sheet";
  const cg = document.createElement("colgroup");
  const c0 = document.createElement("col"); c0.className="rowhdr"; cg.appendChild(c0);
  cols.forEach(w=>{ const c=document.createElement("col"); c.style.width=w+"px"; cg.appendChild(c); });
  t.appendChild(cg);
  const thead=document.createElement("thead"); const htr=document.createElement("tr");
  const corner=document.createElement("th"); corner.className="corner"; htr.appendChild(corner);
  cols.forEach((_,i)=>{ const th=document.createElement("th"); th.textContent=COLNAME(i); htr.appendChild(th); });
  thead.appendChild(htr); t.appendChild(thead);
  const tb=document.createElement("tbody"); t.appendChild(tb);
  return {t, tb};
}

function addRow(tb, rownum, freeze=false){
  const tr=document.createElement("tr"); if(freeze) tr.classList.add("freeze");
  const rh=document.createElement("td"); rh.className="rowhdr"; rh.textContent=rownum;
  tr.appendChild(rh); tb.appendChild(tr); return tr;
}
function cell(tr, text, cls=""){ const td=document.createElement("td"); if(cls) td.className=cls; td.innerHTML=text; tr.appendChild(td); return td; }

/* ---- 전환경로 sheet ---- */
function buildJourney(){
  const pane=document.createElement("div"); pane.className="sheetpane"; pane.dataset.sheet="journey";
  const {t,tb}=tableShell([110,130,190,350,80]);
  let r=addRow(tb,1,true);
  ["단계","시기","도구/방법","전환 트리거","고통지수"].forEach((h,i)=>{
    regCell(cell(r,h), COLNAME(i)+"1");
  });
  JOURNEY.forEach((j,idx)=>{
    const rownum=idx+2;
    const tr=addRow(tb,rownum);
    const z=idx%2?"zebra":"";
    regCell(cell(tr, j.phase, "title "+z), `A${rownum}`, {explain:`전환 단계: ${j.phase}`});
    regCell(cell(tr, j.period, "muted "+z), `B${rownum}`, {explain:`시기: ${j.period}`});
    regCell(cell(tr, j.tool, "muted "+z), `C${rownum}`, {explain:`사용 도구: ${j.tool}`});
    regCell(cell(tr, j.trigger, "wide "+z), `D${rownum}`, {explain:`전환 계기 (현장 체감)`});
    const painCell=cell(tr, `<span class="v">${j.pain}</span>`, "heat "+z);
    const bar=document.createElement("span"); bar.className="databar";
    bar.style.width=(j.pain*0.85)+"%";
    const pct=j.pain/100;
    bar.style.background=`linear-gradient(90deg, rgba(248,113,113,${pct*0.4}), rgba(248,113,113,${pct*0.7}))`;
    painCell.insertBefore(bar, painCell.firstChild);
    regCell(painCell, `E${rownum}`, {
      formula:`=PAIN_INDEX(${j.phase})`,
      explain:`고통지수 ${j.pain} -- 값이 낮아질수록 자동화가 해결한 것`,
      isFormula:true, recalc:()=>j.pain
    });
  });
  // summary
  const sr=addRow(tb,7);
  cell(sr,"<b>=DELTA()</b>","title formula");
  cell(sr,"현재","muted");

  const cNote=cell(sr,"=YIELD_FROM(엑셀_반복업무)","formula wide");
  regCell(cNote,"D7",{formula:`=YIELD_FROM(엑셀->코드)`,
    explain:`수기 100 -> 코드 5: 현장 불합리가 개발자 경로를 만든 것`,
    isFormula:true, recalc:()=>{ cNote.textContent="고통지수 100 -> 5: 자동화가 쌓여 개발자가 됨"; return 5; }});
  const cFin=cell(sr,"=CODE()","formula heat");
  regCell(cFin,"E7",{formula:`=CODE(현장_불합리)`,
    explain:`최종값: 도구를 만드는 사람`,
    isFormula:true, recalc:()=>{ cFin.textContent="개발자"; return 0; }});
  pane.appendChild(t); return pane;
}

      <span class="lab">현재 컨텍스트:</span>
      <div class="toggle" id="excelToggle" role="switch" aria-checked="false" tabindex="0">

        <span class="knob">Excel VBA</span>

      <b>Excel 시절:</b> 보고서마다 함수를 새로 짜고, 시트가 깨질 때마다 처음부터. "더 나은 방법이 있어야 한다"는 확신이 SQL로, 그리고 코드로 이어졌다.
    </div>
    <!-- TODO: 사용자 제공 참고 이미지 삽입 위치 -->
    <div class="img-placeholder">
      <span class="ph-icon">[img]</span>

function heatScale(v){

  return `linear-gradient(90deg, rgba(30,107,63,${a*0.45}), rgba(52,211,153,${a}))`;
}

let activeSheet=null, activeRef=null;
function activateSheet(id, opts={}){
  SHEETS.forEach(s=>panes[s.id].classList.toggle("active", s.id===id));

  activeSheet=id;

  if(id==="tools"){ requestAnimationFrame(()=>{ drawChart(); }); }
  if(!opts.silent) recalcSweep(id, opts.thenSelect);

/* ── cell selection / formula bar / trace ── */
function clearHighlights(){
  document.querySelectorAll(".hl-active,.hl-precedent,.col-band,.row-band").forEach(el=>{
    el.classList.remove("hl-active","hl-precedent","col-band","row-band");
    const fh=el.querySelector(".fillhandle"); if(fh) fh.remove();
  });
}
function fxHTML(formula){
  if(!formula) return `<span class="cmt">-- 입력값 (수식 없음)</span>`;
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const L=String.fromCharCode(0xF000), R=String.fromCharCode(0xF001);
  const strs=[];
  let s=esc(formula).replace(/"([^"]*)"/g,(m,g1)=>{ strs.push(g1); return L+(strs.length-1)+R; });
  s=s
    .replace(/=([A-Z_]+)/g,'=<span class="kw">$1</span>')
    .replace(/\b([A-Z]+\d+(?::[A-Z]+\d+)?)\b/g,'<span class="ref">$1</span>');
  s=s.replace(new RegExp(L+"(\\d+)"+R,"g"),(m,i)=>`<span class="str">"${strs[+i]}"</span>`);
  return s;
}
const traceOn=()=>$("#btnTrace").classList.contains("on");
function selectCell(ref){
  const c=CELLS[ref]; if(!c||!c.el) return;
  clearHighlights();
  activeRef=ref;
  c.el.classList.add("hl-active");
  const fh=document.createElement("span"); fh.className="fillhandle"; c.el.appendChild(fh);
  $("#nameRef").textContent=ref;
  $("#fxInput").innerHTML=fxHTML(c.formula)+(c.formula?` &nbsp;<span class="cmt">// ${c.explain||""}</span>`:(c.explain?`<span class="cmt">// ${c.explain}</span>`:""));
  $("#sbCell").textContent="셀 "+ref;
  const v=c.el.querySelector(".v");
  $("#sbAgg").textContent=c.isFormula?("값: "+(v?v.textContent:c.el.textContent.trim())):"합계: --";
  if(traceOn()&&c.precedents&&c.precedents.length){
    c.precedents.forEach(p=>{ const pc=CELLS[p]; if(pc&&pc.el){ pc.el.classList.remove("hl-precedent"); void pc.el.offsetWidth; pc.el.classList.add("hl-precedent"); }});
  }
}
gw.addEventListener("click",e=>{
  const td=e.target.closest("td[data-ref]"); if(!td) return;
  stopAutoplay();
  selectCell(td.dataset.ref);
});

/* ── hover tooltip ── */
const tip=$("#celltip");
gw.addEventListener("mousemove",e=>{
  const td=e.target.closest("td[data-ref]");
  if(!td){ tip.classList.remove("show"); return; }
  const c=CELLS[td.dataset.ref];
  if(!c||(!c.formula&&!c.explain)){ tip.classList.remove("show"); return; }
  tip.innerHTML=(c.formula?`<span class="tk">${td.dataset.ref}</span>  ${fxHTML(c.formula)}<br>`:`<span class="tk">${td.dataset.ref}</span><br>`)+(c.explain||"");
  tip.style.left=Math.min(window.innerWidth-310, e.clientX+14)+"px";
  tip.style.top=(e.clientY+16)+"px";
  tip.classList.add("show");
});
gw.addEventListener("mouseleave",()=>tip.classList.remove("show"));

/* ── recalculation sweep ── */
const led=$("#led"), recalcMsg=$("#recalcMsg"), sbReady=$("#sbReady");
function recalcSweep(sheetId, thenSelect, onDone){
  const pane=panes[sheetId];
  const formulaCells=[...pane.querySelectorAll("td.formula, td.heat")].filter(td=>td.dataset.ref&&CELLS[td.dataset.ref]&&CELLS[td.dataset.ref].isFormula);
  led.className="recalc-led busy"; recalcMsg.textContent="재계산 중..."; sbReady.textContent="계산 중";
  let i=0;
  const step=()=>{
    if(i>=formulaCells.length){
      led.className="recalc-led done"; recalcMsg.textContent="계산 완료";
      sbReady.innerHTML='<span class="ready">준비</span>';
      const now=new Date();
      $("#lastcalc").textContent=now.toLocaleTimeString("ko-KR",{hour12:false});
      if(thenSelect){ selectCell(thenSelect); }
      if(onDone) onDone();
      return;
    }
    const td=formulaCells[i++]; const c=CELLS[td.dataset.ref];
    td.classList.add("recalcing");
    if(c.recalc){ try{ c.recalc(); }catch(_){} td.classList.add("justset"); setTimeout(()=>td.classList.remove("justset"),700); }
    setTimeout(()=>td.classList.remove("recalcing"),500);
    setTimeout(step, 75);
  };
  step();
}

/* ── Excel/Code 토글 ── */
function wireToggle(){
  const tg=$("#excelToggle"); if(!tg) return;
  const knob=tg.querySelector(".knob"), rows=$("#daxRows"), note=$("#pvNote");
  const flip=()=>{
    const after=tg.classList.toggle("after");
    tg.setAttribute("aria-checked", after);
    if(after){
      knob.textContent="Code";
      rows.style.color="var(--good)"; rows.textContent="-> 코드 1파일로 관리";
      note.innerHTML=`<b>Code:</b> SQL 쿼리 한 줄, Python 스크립트 하나가 VBA 200줄과 엑셀 50개 시트를 대체. 구조를 먼저 바꾸면 데이터는 자동으로 쌓인다.`;
      drawChart(true);
    }else{
      knob.textContent="Excel VBA"; rows.style.color="var(--ink-3)"; rows.textContent="-> 수기 100% 의존";
      note.innerHTML=`<b>Excel 시절:</b> 보고서마다 함수를 새로 짜고, 시트가 깨질 때마다 처음부터. "더 나은 방법이 있어야 한다"는 확신이 SQL로, 그리고 코드로 이어졌다.`;
      drawChart(false);
    }
  };
  tg.addEventListener("click",flip);
  tg.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}});
}

/* ── PIVOT CHART ── */
function drawChart(codeMode=false){
  const el=$("#chart"); if(!el) return;
  if(!chart){ chart=echarts.init(el,null,{renderer:"canvas"}); }
  const data=TOOLS.map(t=>({name:t.name, value:t.power, kind:t.kind}));
  chart.setOption({
    animationDuration:700, animationEasing:"cubicOut",
    backgroundColor:"transparent",
    grid:{left:8,right:18,top:10,bottom:6,containLabel:true},
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"},
      backgroundColor:"#0d1520",borderColor:"#1e2736",textStyle:{color:"#c9d4e0",fontSize:11,fontFamily:"monospace"},
      formatter:p=>`${p[0].name}<br/>역량치 = <b>${p[0].value}</b>`},
    xAxis:{type:"value",max:100,splitLine:{lineStyle:{color:"#1e2736"}},
      axisLabel:{color:"#4f6070",fontFamily:"monospace",fontSize:10},axisLine:{show:false},axisTick:{show:false}},
    yAxis:{type:"category",data:data.map(d=>d.name),inverse:true,
      axisLabel:{color:codeMode?"#4ade80":"#8999ad",fontWeight:"bold",fontSize:11,fontFamily:"sans-serif"},
      axisLine:{lineStyle:{color:"#1e2736"}},axisTick:{show:false}},
    series:[{
      type:"bar",data:data.map(d=>({value:d.value,itemStyle:{color:CAT_COLOR[d.kind]||"#1e6b3f",borderRadius:[0,4,4,0],opacity:codeMode?1:0.8}})),
      barWidth:codeMode?20:16,
      label:{show:true,position:"right",color:"#8999ad",fontFamily:"monospace",fontWeight:"bold",fontSize:11,formatter:p=>p.value}
    }]
  });
  const lg=$("#chartLegend");
  if(lg){ lg.innerHTML=data.map(d=>`<span><i style="background:${CAT_COLOR[d.kind]||'#1e6b3f'}"></i>${d.kind}</span>`).join(""); }
}
window.addEventListener("resize",()=>{ if(chart) chart.resize(); });

/* ── ribbon buttons ── */
$("#btnRecalc").addEventListener("click",()=>{ stopAutoplay(); recalcSweep(activeSheet, activeRef); });
$("#btnTrace").addEventListener("click",()=>{ $("#btnTrace").classList.toggle("on"); if(activeRef) selectCell(activeRef); });
$("#btnHeat").addEventListener("click",()=>{
  const on=$("#btnHeat").classList.toggle("on");
  document.querySelectorAll(".databar").forEach(b=>b.style.display=on?"":"none");
});

/* ─────────────────────────────────────────────────────────────────────
   AUTO-PLAY  (스크롤/클릭 없이 자동 반복 재계산 스윕)
   ───────────────────────────────────────────────────────────────────── */
const AUTOPLAY_SHEETS=["journey","principles","tools","contact"];
let apIdx=0, apTimer=null, apActive=true;

function autoplayStep(){
  if(!apActive) return;
  const sheetId=AUTOPLAY_SHEETS[apIdx % AUTOPLAY_SHEETS.length];
  activateSheet(sheetId, {silent:true});
  // pick a meaningful default cell per sheet
  const defaultCells={journey:"E2", principles:"B2", tools:"D4", contact:"B2"};
  const sel=defaultCells[sheetId];
  recalcSweep(sheetId, sel, ()=>{
    if(!apActive) return;
    apTimer=setTimeout(()=>{
      if(!apActive) return;
      apIdx++;
      apTimer=setTimeout(autoplayStep, 400);
    }, 2800);
  });
}

function stopAutoplay(){
  apActive=false;
  if(apTimer){ clearTimeout(apTimer); apTimer=null; }
}

/* ─────────────────────────────────────────────────────────────────────
   FIRST PAINT
   ───────────────────────────────────────────────────────────────────── */
async function boot(){
  if(document.fonts&&document.fonts.ready){ try{ await document.fonts.ready; }catch(_){} }

  // pre-fill formula cells synchronously
  Object.values(CELLS).forEach(c=>{ if(c.recalc){ try{ c.recalc(); }catch(_){} }});

  // show first sheet immediately (silent, no recalc yet)
  activateSheet("journey", {silent:true});
  $("#tabs").children[0].classList.add("active");
  selectCell("E2");

  // wire toggle after metrics pane is in DOM
  wireToggle();

  // offscreen chart pre-render
  setTimeout(()=>{
    const wasActive=activeSheet;
    panes.tools.classList.add("active");
    drawChart(false);
    panes.tools.classList.toggle("active", wasActive==="tools");
  }, 100);

  // layout gate: give layout time to settle before autoplay
  setTimeout(()=>{
    apActive=true;
    autoplayStep();
  }, 350);
}
boot();

window.addEventListener("keydown",e=>{
  if(e.key==="F9"){ e.preventDefault(); stopAutoplay(); recalcSweep(activeSheet, activeRef); }
});
</script>
