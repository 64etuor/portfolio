<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박양하 · PCB Portfolio · REV 2026</title>
<style>
  :root{
    --mask:#0a3b2e;          /* soldermask dark green */
    --mask2:#0c4a39;
    --mask-edge:#06281f;
    --copper:#caa24a;        /* exposed copper / trace base */
    --copper-lit:#ffcf5e;
    --gold:#e8c468;          /* ENIG pad */
    --gold-hi:#fff0bf;
    --silk:#e9f3ee;          /* white silkscreen */
    --silk-dim:#9fc3b3;
    --signal:#7df9d0;        /* energized current */
    --signal2:#5ad0ff;
    --red:#ff5a52;
    --led-green:#5fffa8;
    --led-amber:#ffc24d;
    --pcb-bg:#04130f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--pcb-bg);overflow:hidden;
    font-family:"DejaVu Sans Mono","SFMono-Regular",Menlo,Consolas,monospace;
    word-break:keep-all;color:var(--silk);}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  svg{display:block;width:100vw;height:100vh;}

  /* ---- HUD / controls ---- */
  #hud{position:fixed;top:18px;left:22px;z-index:30;}
  #title{font-weight:700;letter-spacing:.5px;font-size:13px;color:var(--silk);
    text-shadow:0 0 8px rgba(125,249,208,.25);}
  #title b{color:var(--led-green)}
  #sub{font-size:10.5px;color:var(--silk-dim);margin-top:3px;letter-spacing:.4px;}

  #power{position:fixed;top:18px;right:22px;z-index:30;display:flex;align-items:center;gap:12px;
    background:rgba(4,19,15,.7);border:1px solid #1c5544;border-radius:30px;padding:7px 9px 7px 16px;
    backdrop-filter:blur(4px);}
  #power .lbl{font-size:11px;letter-spacing:2px;color:var(--silk-dim);font-weight:700;}
  #power .lbl.on{color:var(--led-green);text-shadow:0 0 10px var(--led-green);}
  .switch{width:54px;height:28px;border-radius:16px;background:#10261f;border:1px solid #2a6a55;
    position:relative;cursor:pointer;transition:.35s;flex:0 0 auto;}
  .switch.on{background:#0e5f44;border-color:var(--led-green);box-shadow:0 0 14px rgba(95,255,168,.5) inset,0 0 12px rgba(95,255,168,.35);}
  .knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#cdd6d0 60%,#8a978f);transition:.35s;}
  .switch.on .knob{left:30px;background:radial-gradient(circle at 35% 30%,#fff,#c9ffe4 55%,#5fffa8);}

  /* ---- datasheet panel ---- */
  #sheet{position:fixed;top:0;right:0;height:100%;width:430px;max-width:92vw;z-index:40;
    transform:translateX(105%);transition:transform .5s cubic-bezier(.16,1,.3,1);
    background:linear-gradient(160deg,#072a21,#04140f);
    border-left:1px solid #1c5544;box-shadow:-20px 0 60px rgba(0,0,0,.6);
    display:flex;flex-direction:column;}
  #sheet.open{transform:translateX(0)}
  #sheet .top{padding:22px 24px 16px;border-bottom:1px dashed #1c5544;position:relative;}
  #sheet .refdes{font-size:11px;letter-spacing:3px;color:var(--led-amber);font-weight:700;}
  #sheet h2{margin:6px 0 2px;font-size:20px;color:var(--silk);}
  #sheet .role{font-size:12px;color:var(--signal);}
  #sheet .pkg{font-size:10.5px;color:var(--silk-dim);margin-top:7px;letter-spacing:.5px;}
  #sheet .body{padding:18px 24px;overflow:auto;flex:1;}
  #sheet .desc{font-size:12.5px;line-height:1.85;color:#cfe6db;}
  #sheet .sech{font-size:10px;letter-spacing:2px;color:var(--silk-dim);margin:20px 0 10px;
    border-bottom:1px solid #143a2e;padding-bottom:5px;}
  .metric{display:flex;justify-content:space-between;align-items:baseline;
    padding:8px 11px;margin-bottom:7px;background:rgba(125,249,208,.05);
    border:1px solid #16493a;border-radius:5px;}
  .metric .k{font-size:11.5px;color:#bfe0d3;}
  .metric .v{font-size:14px;font-weight:700;color:var(--led-green);
    font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(95,255,168,.35);}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:10.5px;padding:4px 9px;border:1px solid #2a6a55;border-radius:4px;
    color:#cfe6db;background:rgba(232,196,104,.06);}
  #close{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--silk-dim);
    font-size:16px;border:1px solid #1c5544;border-radius:5px;width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);}
  #close:hover{color:var(--red);border-color:var(--red);}

  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;
    font-size:10.5px;color:var(--silk-dim);letter-spacing:1px;
    background:rgba(4,19,15,.6);border:1px solid #143a2e;padding:6px 14px;border-radius:14px;}
  #hint b{color:var(--signal)}

  /* component hover */
  .comp{cursor:pointer}
  .comp .hit{fill:transparent}
  .comp:hover .body-fill{filter:brightness(1.25)}
  .comp:hover .pkg-outline{stroke:var(--signal)}

  .silk{fill:var(--silk);font-family:inherit;}
  .silk-dim{fill:var(--silk-dim);font-family:inherit;}
  .copper-fill{fill:url(#copperHatch)}
</style>
</head>

/* ================= TRACES ================= */
// orthogonal/45° router between two points -> path string
function route(x1,y1,x2,y2,bias){
  const dx=x2-x1, dy=y2-y1;
  const ax=Math.abs(dx), ay=Math.abs(dy);
  const sx=Math.sign(dx)||1, sy=Math.sign(dy)||1;
  const d=Math.min(ax,ay);
  // 45 degree diagonal then straight (engineer style)
  if(bias==="hv"){
    return `M ${x1} ${y1} L ${x1+sx*(ax-d)} ${y1} L ${x2} ${y2-sy*0} L ${x2} ${y2}`;
  }
  // diagonal-first: go straight, then 45, then straight
  const run=(ax>ay)?(ax-ay):0;
  const runY=(ay>ax)?(ay-ax):0;
  return `M ${x1} ${y1} L ${x1+sx*run} ${y1+sy*runY} L ${x2} ${y2}`;
}

/* build connection graph */
function buildTraces(){
  const I=DATA.ICS;
  const U1=I[0],U2=I[1],U3=I[2],U4=I[3];
  const cx=o=>o.x+o.w/2, cy=o=>o.y+o.h/2;
  // power rail from connector edge (left) feeding all ICs (the "VCC" bus)
  const railX=120;
  // main backbone: U1 -> U2 -> U3 (career timeline) all routing into U4 (MCU)
  addTrace(route(U1.x+U1.w, cy(U1), U2.x, cy(U2)), 2);
  addTrace(route(U2.x+U2.w, cy(U2), U3.x, cy(U3)), 3);
  addTrace(route(cx(U1), U1.y+U1.h, cx(U4)-90, U4.y), 5,"--signal2");
  addTrace(route(cx(U2), U2.y+U2.h, cx(U4), U4.y), 6,"--signal2");
  addTrace(route(cx(U3), U3.y+U3.h, cx(U4)+90, U4.y), 7,"--signal2");
  // VCC rail to U1 (boot first)
  addTrace(`M ${railX} 250 L ${U1.x} 250`,1);
  addTrace(`M ${railX} 700 L 360 700 L 360 ${U4.y+U4.h} L ${cx(U4)} ${U4.y+U4.h}`,8);

  // power bus vertical on left
  addTrace(`M ${railX} 140 L ${railX} 840`,0,"--copper");

  drawTraces();
}

/* fake-but-real-looking QR */
function drawQR(x,y,label){
  const g=el("g",{class:"comp"});
  const N=11, s=8;
  // quiet zone
  g.appendChild(el("rect",{x:x-6,y:y-6,width:N*s+12,height:N*s+12,fill:"#e9f3ee",rx:2}));
  // deterministic pattern
  let seed=7;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const finder=(fx,fy)=>{
    for(let a=0;a<7;a++)for(let b=0;b<7;b++){
      const edge=a===0||a===6||b===0||b===6, inner=a>=2&&a<=4&&b>=2&&b<=4;
      if(edge||inner) g.appendChild(el("rect",{x:x+(fx+a)*s,y:y+(fy+b)*s,width:s,height:s,fill:"#04130f"}));
    }
  };
  for(let a=0;a<N;a++)for(let b=0;b<N;b++){
    const inFinder=(a<7&&b<7)||(a>N-1)||(b>N-1);
    if(a<7&&b<7) continue;
    if(rnd()>.5) g.appendChild(el("rect",{x:x+a*s,y:y+b*s,width:s,height:s,fill:"#04130f"}));
  }
  finder(0,0);
  const lab=el("text",{x:x+N*s/2,y:y+N*s+22,fill:"#9fc3b3","font-size":8,"text-anchor":"middle"});
  lab.textContent="⤷ github.com/64etuor";g.appendChild(lab);
  g.style.cursor="pointer";
  g.addEventListener("click",()=>window.open("https://github.com/64etuor","_blank"));
  $("#comps").appendChild(g);
}

      grp.appendChild(el("circle",{cx:x+14,cy:y+13,r:13,fill:"url(#gold)",stroke:"#6b531f","stroke-width":1.5,class:"body-fill"}));
      grp.appendChild(el("circle",{cx:x+14,cy:y+13,r:6,fill:"#04130f"}));
    }
    // refdes + label silk
    const rd=el("text",{x:x+46,y:y+2,fill:"#cfe6db","font-size":8.5,"font-weight":700,"letter-spacing":.5});
    rd.textContent=n.ref+" · "+n.label;grp.appendChild(rd);
    const tt=el("text",{x:x+46,y:y+16,fill:"#9fc3b3","font-size":9.5});
    tt.textContent=n.title;grp.appendChild(tt);
    const ins=el("text",{x:x+46,y:y+30,fill:"#7df9d0","font-size":8,"letter-spacing":.2});
    ins.textContent=n.insight.length>62?n.insight.slice(0,60)+"…":n.insight;grp.appendChild(ins);
    // status LED (energizes in boot sequence, staggered after main board)
    const led=el("circle",{cx:x+14,cy:y+13,r:4,fill:"#143a2e"});
    if(n.kind==="IC"){led.setAttribute("cx",x+14);led.setAttribute("cy",y+13);}
    led.dataset.order=4+i; led.dataset.color="--signal";
    grp.appendChild(led); engNoteLEDs.push(led); LEDS.push(led);

    g.appendChild(grp);
    grp.addEventListener("click",()=>openSheetEng(i));
    grp.addEventListener("mouseenter",()=>{ if(powered) setLED(led,true); });
  });

  // belief silkscreen banner inside cluster footer
  const by=oy+16+N.length*rh-2;
  const bel=el("text",{x:ox-6,y:by+18,fill:"#ffc24d","font-size":9,"font-weight":700,"letter-spacing":.4});
  bel.textContent="◆ "+DATA.BELIEF;lab.appendChild(bel);
}

/* ================= POWER SEQUENCE ================= */
let powered=true;          // boot energized on first paint (for headless/PDF)
let pulseRAF=null, dashOff=0;

function setLED(led,on){
  const col=getComputedStyle(document.documentElement).getPropertyValue(led.dataset.color||"--led-green").trim();
  if(on){led.setAttribute("fill",col);led.setAttribute("filter","url(#ledGlow)");}
  else {led.setAttribute("fill","#143a2e");led.removeAttribute("filter");}
}
function energizeTrace(p,on){ p.setAttribute("opacity", on?0.95:0); }

function animatePulses(){
  dashOff -= 1.6;
  pulsePaths.forEach(p=>{ if(p.getAttribute("opacity")>0) p.setAttribute("stroke-dashoffset",dashOff); });
  pulseRAF=requestAnimationFrame(animatePulses);
}

function bootSequence(){
  // ordered energize: rail -> traces -> LEDs by .order
  const maxOrder=8;
  for(let o=0;o<=maxOrder;o++){
    setTimeout(()=>{
      pulsePaths.filter(p=>+p.dataset.order===o).forEach(p=>energizeTrace(p,true));
      LEDS.filter(l=>+l.dataset.order===o).forEach(l=>setLED(l,true));
    }, o*160);
  }
}
function powerDown(){
  pulsePaths.forEach(p=>energizeTrace(p,false));
  LEDS.forEach(l=>setLED(l,false));
  if(scanLED){scanLED.setAttribute("fill","#143a2e");scanLED.removeAttribute("filter");}
}
function powerUp(){
  if(scanLED){scanLED.setAttribute("fill","#5fffa8");scanLED.setAttribute("filter","url(#ledGlow)");}
  bootSequence();
}

$("#sw").addEventListener("click",()=>{
  powered=!powered;
  const sw=$("#sw"), lbl=$("#pwrlbl");
  if(powered){sw.classList.add("on");lbl.classList.add("on");lbl.textContent="POWER · ON";powerUp();}
  else{sw.classList.remove("on");lbl.classList.remove("on");lbl.textContent="POWER · OFF";powerDown();}
});

/* ================= INIT ================= */
function init(){
  mountHoles(); edgeTicks(); buildTraces(); vias();
  DATA.ICS.forEach((ic,i)=>drawIC(ic,i));
  drawBOM(); drawTP(); drawConnector();
  visionScanner(); weldRepair(); drawEngNotes();
  // energized on first paint (headless-friendly): show traces lit immediately + run boot
  pulsePaths.forEach(p=>energizeTrace(p,true));
  LEDS.forEach(l=>setLED(l,true));
  animatePulses();
  // re-run staged boot for live viewers shortly after fonts settle
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{ /* fonts ready, board already painted */ });
  }
  setTimeout(()=>{ if(powered){ powerDown(); setTimeout(bootSequence,120);} }, 400);
}
init();
