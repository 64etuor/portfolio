<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COST CASCADE // 결함점 균열 전파</title>
<!-- TODO(security): CSS @import inside <style> cannot carry SRI integrity hashes.
     Real fix: replace with <link rel="stylesheet" href="..." crossorigin="anonymous" integrity="sha384-..."> or self-host fonts. -->
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root{
    --bg:#050505;
    --bg2:#101010;
    --phos:#d7d7d7;
    --phos-dim:#8d8d8d;
    --phos-deep:#3a3a3a;
    --sig:#c2553a;        /* restrained ember — only emerges as cost spreads */
    --sig-hot:#efb9a5;
    --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  }
  @font-face{
    font-family:'JetBrains Mono';font-display:swap;font-weight:400;
    src:url('https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'JetBrains Mono';font-display:swap;font-weight:700;
    src:url('https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-700-normal.woff2') format('woff2');
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--phos);
    font-family:var(--mono);overflow:hidden;
    word-break:keep-all;-webkit-font-smoothing:none;
  }
  .kr{font-family:'Pretendard Variable', 'Pretendard',var(--mono);}

  /* ===== full-bleed cinematic stage ===== */
  #stage{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(ellipse 130% 130% at 50% 44%, var(--bg2) 0%, var(--bg) 60%, #000 100%);}
  #field{position:absolute;inset:0;display:block;z-index:5;}

  /* CRT shell */
  #stage::before{ /* scanlines */
    content:"";position:absolute;inset:0;z-index:60;pointer-events:none;
    background:repeating-linear-gradient(0deg,
      rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.13) 3px,rgba(0,0,0,0.13) 4px);
    mix-blend-mode:multiply;}
  #stage::after{ /* vignette */
    content:"";position:absolute;inset:0;z-index:61;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, transparent 56%, rgba(0,0,0,.78) 100%);
    opacity:.9;}

  /* ===== overlay typography ===== */
  .ov{position:absolute;z-index:30;pointer-events:none;}

  /* top headline — the protagonist */
  #headline{top:8.5%;left:50%;transform:translateX(-50%);
    text-align:center;width:92%;
    font-family:'Pretendard Variable', 'Pretendard',var(--mono);font-weight:800;
    font-size:clamp(22px,3.5vw,52px);line-height:1.12;letter-spacing:-.01em;
    color:var(--phos);text-shadow:0 0 14px rgba(215,215,215,.18);
    opacity:0;transition:opacity .7s ease, filter .7s ease;filter:blur(7px);}
  #headline.show{opacity:1;filter:blur(0);}
  #headline em{font-style:normal;color:var(--sig-hot);
    text-shadow:0 0 18px rgba(194,85,58,.55);}

  /* three terminal labels — slam in at fracture ends */
  .clabel{position:absolute;z-index:32;transform:translate(-50%,-50%) scale(1);
    text-align:center;opacity:0;will-change:transform,opacity,filter;}
  .clabel .big{font-family:'Pretendard Variable', 'Pretendard',var(--mono);font-weight:800;
    font-size:clamp(26px,4.4vw,72px);line-height:.98;letter-spacing:-.015em;
    color:var(--phos);
    text-shadow:0 0 4px rgba(0,0,0,.9), 0 0 26px rgba(194,85,58,.42);
    white-space:nowrap;}
  .clabel .tag{display:block;margin-top:9px;font-size:11px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--sig);text-shadow:0 0 8px rgba(194,85,58,.5);}
  .clabel .ticks{display:flex;gap:4px;justify-content:center;margin-top:11px;}
  .clabel .ticks i{display:block;width:13px;height:3px;background:var(--phos-deep);
    transform:scaleX(0);transform-origin:left;transition:transform .18s ease, background .18s;}
  .clabel.in{animation:slam .46s cubic-bezier(.16,.86,.24,1.04) forwards;}
  .clabel.in .ticks i{background:var(--sig);transform:scaleX(1);}
  .clabel.in .ticks i:nth-child(1){transition-delay:.10s}
  .clabel.in .ticks i:nth-child(2){transition-delay:.17s}
  .clabel.in .ticks i:nth-child(3){transition-delay:.24s}
  .clabel.in .ticks i:nth-child(4){transition-delay:.31s}
  .clabel.out{opacity:0;transform:translate(-50%,-50%) scale(1.04);
    transition:opacity .55s ease, transform .55s ease;}
  @keyframes slam{
    0%{opacity:0;transform:translate(-50%,-50%) scale(1.55);filter:blur(9px);}
    55%{opacity:1;filter:blur(0);}
    70%{transform:translate(-50%,-50%) scale(.955);}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0);}
  }

  /* origin caption (idle quiet state) */
  #origintag{z-index:33;transform:translate(-50%,-50%);text-align:center;
    font-size:11.5px;letter-spacing:.18em;color:var(--phos-dim);
    opacity:0;transition:opacity .6s ease;}
  #origintag.show{opacity:.9;}
  #origintag .t{display:block;color:var(--phos-deep);font-size:9.5px;
    letter-spacing:.4em;margin-bottom:5px;}
  #origintag .blink{animation:blink 1.1s steps(2) infinite;color:var(--sig);}
  @keyframes blink{50%{opacity:0}}

  /* bottom subline */
  #subline{bottom:6.5%;left:50%;transform:translateX(-50%);text-align:center;width:90%;
    font-family:'Pretendard Variable', 'Pretendard',var(--mono);font-weight:500;
    font-size:clamp(13px,1.5vw,20px);letter-spacing:.01em;color:var(--phos-dim);
    opacity:0;transition:opacity .7s ease;}
  #subline.show{opacity:.95;}
  #subline b{color:var(--phos);font-weight:700;}
  #subline .arr{color:var(--sig);font-weight:700;padding:0 .35em;}

  /* corner frame ticks — quiet instrument chrome */
  .frame{position:absolute;z-index:34;color:var(--phos-deep);font-size:10.5px;
    letter-spacing:.28em;text-transform:uppercase;opacity:.65;}
  .frame.tr{top:26px;right:32px;text-align:right}
  .frame.bl{bottom:26px;left:32px}
  .frame.br{bottom:26px;right:32px;text-align:right}

  /* canonical scene eyebrow (matches 28) */
  .eyebrow{position:absolute;z-index:34;left:5.4%;top:12.2%;pointer-events:none;
    font-family:var(--mono);font-size:clamp(10px,.82vw,15px);
    letter-spacing:.42em;color:var(--phos-dim);text-shadow:none;text-transform:none;}
  .eyebrow b{color:var(--sig);text-shadow:0 0 8px rgba(194,85,58,.4);font-weight:700;}

  @media (max-width:760px){
    .frame{font-size:9px;letter-spacing:.18em}
    .clabel .big{font-size:clamp(20px,7vw,40px)}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="field"></canvas>

  <!-- chrome -->
  <div class="eyebrow kr"><b>SCENE 07</b> · 비용 — COST CASCADE</div>
  <div class="frame tr">FRACTURE&nbsp;PROPAGATION</div>
  <div class="frame bl">ORIGIN&nbsp;→&nbsp;3&nbsp;BRANCH</div>
  <div class="frame br">∞&nbsp;SEAMLESS&nbsp;LOOP</div>

  <!-- typography overlay -->
  <h1 id="headline" class="ov kr">커뮤니케이션 오류는 곧 <em>비용</em>이 됩니다.</h1>

  <div id="origintag" class="ov kr">
    <span class="t">ORIGIN</span>결함점 · 커뮤니케이션 오류<span class="blink"> ▮</span>
  </div>

  <!-- three terminal labels (positioned by JS to match fracture targets) -->
  <div class="clabel kr" data-i="0">
    <span class="big">일정 지연</span>
    <span class="tag">Schedule&nbsp;Slip</span>
    <span class="ticks"><i></i><i></i><i></i><i></i></span>
  </div>
  <div class="clabel kr" data-i="1">
    <span class="big">기능 미스매치</span>
    <span class="tag">Spec&nbsp;Mismatch</span>
    <span class="ticks"><i></i><i></i><i></i><i></i></span>
  </div>
  <div class="clabel kr" data-i="2">
    <span class="big">현장 불만족</span>
    <span class="tag">Site&nbsp;Dissatisfaction</span>
    <span class="ticks"><i></i><i></i><i></i><i></i></span>
  </div>

  <p id="subline" class="ov kr">한 점의 어긋남이<span class="arr">→</span><b>세 갈래의 비용</b>으로 이어집니다.</p>
</div>

<script>
"use strict";
/* ============================================================
   COST CASCADE — 결함점 균열 전파
   한 점(커뮤니케이션 오류) → 응력 균열이 격자를 타고 전파 →
   세 갈래 파단선이 [일정 지연·기능 미스매치·현장 불만족]에 박힘 →
   지나간 격자 노드 붕괴 → 균열 역재봉으로 한 점 리셋 → 무한 루프.
   ============================================================ */

const cv = document.getElementById('field');
const ctx = cv.getContext('2d');
const $ = s => document.querySelector(s);
const headline = $('#headline'), subline = $('#subline'), origintag = $('#origintag');
const labelEls = Array.from(document.querySelectorAll('.clabel'));

let W=0, H=0, DPR=1;

/* ---- single source of truth: origin + 3 targets (fractional) ---- */
const ORIGIN_F = {x:0.50, y:0.305};
const TARGETS_F = [
  {x:0.180, y:0.715, arrive:0.74},  // 일정 지연      (lands first)
  {x:0.500, y:0.835, arrive:0.93},  // 기능 미스매치  (lands last, deepest)
  {x:0.820, y:0.715, arrive:0.83},  // 현장 불만족    (lands middle)
];

/* ---- seeded PRNG (intentional, repeatable geometry per loop) ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let seed = 1337;

/* ---- geometry state ---- */
let origin={x:0,y:0}, targets=[];
let branches=[];          // {pts:[[x,y]..], cum:[..], total, pStart, pEnd, w, trunk}
let damaged=[];           // {x,y,failP}
let lattice=null;         // offscreen static lattice
let sparks=[];            // tip phosphor trail

/* ---- timeline (ms) ---- */
const PH = {idle:1700, charge:620, rupture:2650, hold:2250, heal:1550};
const TOTAL = PH.idle+PH.charge+PH.rupture+PH.hold+PH.heal;
let loopStart = 0;
let arrived = [false,false,false];
let prevPhase = '';

/* ===================== sizing ===================== */
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  origin = {x:ORIGIN_F.x*W, y:ORIGIN_F.y*H};
  targets = TARGETS_F.map(t=>({x:t.x*W, y:t.y*H, arrive:t.arrive}));

  // place DOM elements at matching coords
  origintag.style.left = (ORIGIN_F.x*100)+'%';
  origintag.style.top  = ((ORIGIN_F.y)*100 - 7.5)+'%';
  labelEls.forEach((el,i)=>{
    el.style.left = (TARGETS_F[i].x*100)+'%';
    el.style.top  = (TARGETS_F[i].y*100)+'%';
  });

  buildLattice();
  regen();
}

/* ===================== static lattice (offscreen) ===================== */
let nodesX, NSX, NSY;
function buildLattice(){
  const step = Math.max(22, Math.min(34, W/56));
  NSX = Math.ceil(W/step)+1;
  NSY = Math.ceil(H/step)+1;
  nodesX = step;

  lattice = document.createElement('canvas');
  lattice.width = W*DPR; lattice.height = H*DPR;
  const lx = lattice.getContext('2d');
  lx.setTransform(DPR,0,0,DPR,0,0);

  // faint structural grid lines (coarse) — the "structure"
  lx.strokeStyle='rgba(215,215,215,0.030)'; lx.lineWidth=1;
  for(let i=0;i<NSX;i+=3){const x=i*step+0.5;lx.beginPath();lx.moveTo(x,0);lx.lineTo(x,H);lx.stroke();}
  for(let j=0;j<NSY;j+=3){const y=j*step+0.5;lx.beginPath();lx.moveTo(0,y);lx.lineTo(W,y);lx.stroke();}

  // intact nodes (dim phosphor dots)
  lx.fillStyle='rgba(140,140,140,0.20)';
  for(let j=0;j<NSY;j++){
    for(let i=0;i<NSX;i++){
      const x=i*step, y=j*step;
      lx.fillRect(x-0.6, y-0.6, 1.4, 1.4);
    }
  }
}

/* ===================== crack generation ===================== */
function genPath(sx,sy,ex,ey,segs,wander,kink,rnd){
  const dx=ex-sx, dy=ey-sy, len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  const pts=[];
  for(let i=0;i<=segs;i++){
    const f=i/segs;
    const env=Math.sin(f*Math.PI);                 // 0 at ends, max mid
    let j=(rnd()*2-1)*wander*env;                   // big curve wander
    j += (rnd()*2-1)*kink;                          // small fracture kinks
    pts.push([sx+dx*f+nx*j, sy+dy*f+ny*j]);
  }
  return pts;
}
function arcLen(pts){
  const cum=[0]; let total=0;
  for(let i=1;i<pts.length;i++){
    total += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    cum.push(total);
  }
  return {cum, total};
}
function pointAt(pts,cum,total,dist){
  if(dist<=0) return pts[0];
  if(dist>=total) return pts[pts.length-1];
  let lo=0,hi=cum.length-1;
  while(lo<hi){const mid=(lo+hi)>>1; if(cum[mid]<dist) lo=mid+1; else hi=mid;}
  const i=Math.max(1,lo); const seg=cum[i]-cum[i-1]||1; const f=(dist-cum[i-1])/seg;
  return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f];
}

function regen(){
  seed = (seed*1103515245 + 12345) & 0x7fffffff;
  const rnd = mulberry32(seed);
  branches = [];

  // 3 main trunks origin -> target
  targets.forEach((tg,ti)=>{
    const dist = Math.hypot(tg.x-origin.x, tg.y-origin.y);
    const segs = Math.max(14, Math.round(dist/26));
    const wander = dist*0.085;
    const pts = genPath(origin.x,origin.y, tg.x,tg.y, segs, wander, 2.4, rnd);
    const {cum,total} = arcLen(pts);
    const pStart = 0.015*ti;                 // tiny stagger at root
    const pEnd = tg.arrive;
    branches.push({pts,cum,total,pStart,pEnd,trunk:true,w:2.1});

    // secondary hairline branches forking off the trunk (dendritic spread)
    const forks = 3 + Math.floor(rnd()*3);
    for(let k=0;k<forks;k++){
      const ff = 0.25 + rnd()*0.6;                       // fork position along trunk
      const fp = pointAt(pts,cum,total, ff*total);
      // local direction of trunk at fork
      const fp2 = pointAt(pts,cum,total, Math.min(total, ff*total+8));
      const ang = Math.atan2(fp2[1]-fp[1], fp2[0]-fp[0]);
      const side = rnd()<0.5?-1:1;
      const off = (0.55 + rnd()*0.7)*side;               // branch angle (rad)
      const blen = dist*(0.10+rnd()*0.16);
      const ex = fp[0]+Math.cos(ang+off)*blen;
      const ey = fp[1]+Math.sin(ang+off)*blen;
      const bsegs = Math.max(5, Math.round(blen/22));
      const bpts = genPath(fp[0],fp[1], ex,ey, bsegs, blen*0.16, 1.8, rnd);
      const ba = arcLen(bpts);
      const pAtFork = pStart + ff*(pEnd-pStart);
      branches.push({pts:bpts,cum:ba.cum,total:ba.total,
        pStart:pAtFork, pEnd:Math.min(1, pAtFork+0.13), trunk:false, w:1.0});
    }
  });

  buildDamage();
  arrived = [false,false,false];
  sparks = [];
}

/* damaged-node precompute: nodes the fracture knocks out, with fail-progress */
function buildDamage(){
  const step = nodesX;
  const cols = NSX, rows = NSY;
  const grid = new Float32Array(cols*rows).fill(Infinity);
  const touch = (cx,cy,p)=>{
    if(cx<0||cy<0||cx>=cols||cy>=rows) return;
    const idx=cy*cols+cx; if(p<grid[idx]) grid[idx]=p;
  };
  branches.forEach(b=>{
    const span = b.pEnd-b.pStart;
    const stepLen = 7;
    for(let d=0; d<=b.total; d+=stepLen){
      const pt = pointAt(b.pts,b.cum,b.total, d);
      const p = b.pStart + (b.total? d/b.total:0)*span;
      const cx = Math.round(pt[0]/step), cy = Math.round(pt[1]/step);
      // node + immediate neighbours collapse (band width)
      touch(cx,cy,p);
      touch(cx+1,cy,p+0.006); touch(cx-1,cy,p+0.006);
      touch(cx,cy+1,p+0.006); touch(cx,cy-1,p+0.006);
      if(b.trunk){ touch(cx+1,cy+1,p+0.012); touch(cx-1,cy-1,p+0.012); }
    }
  });
  damaged=[];
  for(let cy=0;cy<rows;cy++)for(let cx=0;cx<cols;cx++){
    const fp=grid[cy*cols+cx];
    if(fp!==Infinity) damaged.push({x:cx*step,y:cy*step,failP:fp});
  }
}

/* ===================== easing ===================== */
const easeOutQuart=t=>1-Math.pow(1-t,4);
const easeInOutQuad=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeInCubic=t=>t*t*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ===================== phase resolver ===================== */
function resolve(tl){
  let t=tl, ph, frac, p=0, intensity=0, charge=0;
  if(t < PH.idle){ ph='idle'; frac=t/PH.idle; p=0; }
  else if((t-=PH.idle) < PH.charge){ ph='charge'; frac=t/PH.charge; charge=frac; p=0; intensity=frac*0.5; }
  else if((t-=PH.charge) < PH.rupture){ ph='rupture'; frac=t/PH.rupture; p=easeOutQuart(frac); intensity=1; charge=1; }
  else if((t-=PH.rupture) < PH.hold){ ph='hold'; frac=t/PH.hold; p=1; intensity=0.9-0.35*frac; charge=1; }
  else { t-=PH.hold; ph='heal'; frac=t/PH.heal; p=1-easeInOutQuad(frac); intensity=0.4*(1-frac); }
  return {ph,frac,p,intensity,charge};
}

/* ===================== render ===================== */
function draw(st, now){
  const {ph,frac,p,intensity,charge} = st;

  // tremor (deterministic sin — intentional, no per-frame RNG)
  let tx=0, ty=0;
  if(ph==='rupture'){
    const m = (1-frac)*6.5 + 1.5;
    tx = Math.sin(now*0.045)*m*0.5 + Math.sin(now*0.11)*m*0.3;
    ty = Math.cos(now*0.052)*m*0.5 + Math.sin(now*0.09)*m*0.25;
  } else if(ph==='charge'){
    const m = charge*1.8;
    tx = Math.sin(now*0.08)*m; ty = Math.cos(now*0.07)*m;
  }

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(tx,ty);

  // 1) static lattice
  ctx.globalAlpha = 0.55 + 0.25*Math.sin(now*0.0012) + intensity*0.15;
  ctx.drawImage(lattice, 0,0, W,H);
  ctx.globalAlpha = 1;

  // 2) collapsing nodes (structure failing as cost passes)
  for(let i=0;i<damaged.length;i++){
    const n=damaged[i];
    if(p < n.failP) continue;
    const age = p - n.failP;            // 0 = just failed
    if(age < 0.05){                     // bright flash on collapse
      const a = 1-age/0.05;
      ctx.fillStyle = `rgba(239,185,165,${0.85*a})`;
      const s = 2.2 + 4*a;
      ctx.fillRect(n.x-s/2, n.y-s/2, s, s);
    } else {                            // collapsed → dark void (knocked out)
      ctx.fillStyle = 'rgba(5,5,5,0.92)';
      ctx.fillRect(n.x-2.2, n.y-2.2, 4.4, 4.4);
      ctx.fillStyle = 'rgba(194,85,58,0.18)';
      ctx.fillRect(n.x-0.7, n.y-0.7, 1.4, 1.4);
    }
  }

  // 3) crack fracture lines
  if(p>0.0005){
    // glow pass
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.shadowColor='rgba(194,85,58,0.9)';
    for(let pass=0; pass<2; pass++){
      for(let bi=0; bi<branches.length; bi++){
        const b=branches[bi];
        const span=b.pEnd-b.pStart;
        const f=clamp((p-b.pStart)/span,0,1);
        if(f<=0) continue;
        const reveal=f*b.total;
        // build path up to reveal
        ctx.beginPath();
        ctx.moveTo(b.pts[0][0], b.pts[0][1]);
        let last=b.pts[0];
        for(let i=1;i<b.pts.length;i++){
          if(b.cum[i] <= reveal){ ctx.lineTo(b.pts[i][0], b.pts[i][1]); last=b.pts[i]; }
          else{
            const tip=pointAt(b.pts,b.cum,b.total,reveal);
            ctx.lineTo(tip[0],tip[1]); last=tip; break;
          }
        }
        if(pass===0){ // wide ember glow
          ctx.strokeStyle = b.trunk?'rgba(194,85,58,0.30)':'rgba(194,85,58,0.18)';
          ctx.lineWidth = (b.trunk?7:4);
          ctx.shadowBlur = b.trunk?16:9;
        } else {       // hot core
          ctx.strokeStyle = b.trunk?'rgba(239,221,214,0.95)':'rgba(215,200,194,0.7)';
          ctx.lineWidth = b.w;
          ctx.shadowBlur = b.trunk?8:4;
        }
        ctx.stroke();

        // leading tip glow + spark emission (trunks, while growing)
        if(pass===1 && f<1 && b.trunk && (ph==='rupture')){
          ctx.shadowBlur=18; ctx.fillStyle='rgba(255,236,228,0.95)';
          ctx.beginPath(); ctx.arc(last[0],last[1], 3.1, 0, 6.283); ctx.fill();
          if(now%2<1) sparks.push({x:last[0],y:last[1],life:1});
        }
      }
    }
    ctx.shadowBlur=0;
  }

  // 4) spark phosphor trail
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.life-=0.045;
    if(s.life<=0){ sparks.splice(i,1); continue; }
    ctx.fillStyle=`rgba(239,185,165,${s.life*0.6})`;
    const sz=s.life*2.2;
    ctx.fillRect(s.x-sz/2, s.y-sz/2, sz, sz);
  }

  // 5) origin node
  drawOrigin(ph,frac,now,charge,p);

  // 6) shockwave rings at rupture onset
  if(ph==='rupture' && frac<0.4){
    const rf=frac/0.4;
    for(let r=0;r<2;r++){
      const rr = rf*Math.max(W,H)*0.5*(0.6+r*0.5);
      const a=(1-rf)*0.4*(1-r*0.4);
      ctx.strokeStyle=`rgba(194,85,58,${a})`;
      ctx.lineWidth=1.4; ctx.beginPath();
      ctx.arc(origin.x,origin.y, rr, 0, 6.283); ctx.stroke();
    }
  }

  ctx.restore();
}

function drawOrigin(ph,frac,now,charge,p){
  const breathe = 0.5+0.5*Math.sin(now*0.0026);
  let core, glow, size, ring=0;
  if(ph==='idle'){
    core=`rgba(215,215,215,${0.45+0.4*breathe})`;
    glow=`rgba(140,140,140,${0.15+0.15*breathe})`;
    size=3.2+breathe*0.8;
  } else if(ph==='charge'){
    const mix=charge;
    core=`rgba(${215+24*mix},${215-130*mix},${215-157*mix},${0.7+0.3*mix})`;
    glow=`rgba(194,85,58,${0.2+0.5*mix})`;
    size=3.2+mix*3.2; ring=mix;
  } else if(ph==='heal'){
    core=`rgba(${239-24*frac},${85+130*frac},${58+157*frac},${0.9})`;
    glow=`rgba(194,85,58,${0.4*(1-frac)})`;
    size=4 - frac*0.8;
  } else { // rupture/hold — bright source
    core='rgba(255,236,228,0.95)';
    glow='rgba(194,85,58,0.6)';
    size=4.4 + (ph==='rupture'? (1-frac)*2:0);
  }
  ctx.save();
  ctx.shadowBlur=14+ring*16; ctx.shadowColor=glow;
  ctx.fillStyle=core;
  // diamond stress point
  ctx.translate(origin.x,origin.y); ctx.rotate(Math.PI/4);
  ctx.fillRect(-size,-size,size*2,size*2);
  ctx.restore();

  if(ring>0.01){
    ctx.strokeStyle=`rgba(194,85,58,${0.5*ring})`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(origin.x,origin.y, 10+ring*8, 0, 6.283); ctx.stroke();
  }
}

/* ===================== DOM overlay sync ===================== */
function syncOverlay(st){
  const {ph,p} = st;

  // origin caption — idle/charge only
  origintag.classList.toggle('show', ph==='idle' || ph==='charge');

  // headline — show through rupture/hold
  const showHead = (ph==='rupture' && st.frac>0.12) || ph==='hold';
  headline.classList.toggle('show', showHead);

  // subline — after all branches landed
  subline.classList.toggle('show', (ph==='hold' && st.frac>0.18));

  // terminal labels — slam when their trunk reaches target
  if(ph==='rupture' || ph==='hold'){
    targets.forEach((tg,i)=>{
      if(!arrived[i] && p>=tg.arrive){
        arrived[i]=true;
        const el=labelEls[i];
        el.classList.remove('out');
        void el.offsetWidth;      // reflow → restart slam
        el.classList.add('in');
      }
    });
  }

  // heal — retract everything
  if(ph==='heal' && prevPhase!=='heal'){
    labelEls.forEach(el=>{ el.classList.remove('in'); el.classList.add('out'); });
  }
  // wrap reset (idle after heal)
  if(ph==='idle' && prevPhase==='heal'){
    labelEls.forEach(el=>{ el.classList.remove('in','out'); });
    arrived=[false,false,false];
  }
  prevPhase = ph;
}

/* ===================== main loop ===================== */
/* debug-only: ?t=<ms> freezes the timeline at one phase for deterministic capture */
const FREEZE = (()=>{ const v=new URLSearchParams(location.search).get('t');
  return v===null? null : ((+v % TOTAL)+TOTAL)%TOTAL; })();

function frame(now){
  if(FREEZE!==null){
    const st = resolve(FREEZE);
    draw(st, now);
    syncOverlay(st);
    requestAnimationFrame(frame);
    return;
  }
  if(!loopStart) loopStart=now;
  let tl = now - loopStart;
  if(tl >= TOTAL){ loopStart=now; tl=0; regen(); }
  const st = resolve(tl);
  draw(st, now);
  syncOverlay(st);
  requestAnimationFrame(frame);
}

/* ===================== boot ===================== */
window.addEventListener('resize', resize);
resize();
function start(){ loopStart=0; requestAnimationFrame(frame); }
if(document.fonts && document.fonts.ready){
  let s=false; const go=()=>{ if(!s){ s=true; resize(); start(); } };
  document.fonts.ready.then(go); setTimeout(go,600);
} else { start(); }
</script>
